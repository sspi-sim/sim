<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSPI Simulations — Chemistry Unit 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Exactly the hero's own background. The hero is grabbed straight off the
       sim's canvas, whose backdrop is a single flat value — 284,282 of ~290,000
       sampled border pixels are rgb(5,4,15), with no dither or noise at all — so
       matching it here makes the picture's edge literally undetectable, with no
       feathering or pixel surgery needed. */
    --bg:   #05040f;
    --cyan: #3fd0e8;
    /* Size of the sim list. */
    --ufs:  clamp(16px, 2.9vw, 52px);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Lexend', system-ui, sans-serif;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 6vw, 110px);
    padding: clamp(18px, 4vw, 72px);
  }

  /* The hero is a single oxygen atom from the electrons sim, left to run so the
     valence trails fill in. 1520x1520, lifted from the canvas with toDataURL
     rather than screenshotted: the sim sets canvas.width = window.innerWidth, so
     it renders at 1 CSS px per pixel and a screen grab can never beat the window.
     Oversizing the backing store to 1800x1800 and raising viewZoom to suit draws
     the same atom with 2.7x the pixels, and skips the UI chrome for free.

     Trail strokes are 6px here against the sim's 1.5px — at this zoom its fixed
     width goes hairline-thin next to the atom. 6 was picked off a ladder shot at
     one frozen instant (3/4/5/6/7.5) so the weights were compared on identical
     geometry; past about 7.5 the orbits stop reading as separate where they cross.
     Capture-only: scaled on the capture page's 2D context, not in the sim, which
     still strokes trails at 1.5px for the students using it. */
  #hero {
    flex: 0 0 auto;
    height: min(82vh, 44vw);
    width: auto;
    display: block;
  }

  #sims {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    font-size: var(--ufs);
    gap: 0.62em;
  }

  #sims a {
    display: block;
    color: rgba(255,255,255,0.92);
    text-decoration: none;
    font-size: var(--ufs);
    font-weight: 600;
    letter-spacing: 0.2em;
    line-height: 1.25;
    white-space: nowrap;
    transition: color 0.18s ease, transform 0.18s ease;
  }

  #sims a:hover, #sims a:focus-visible {
    color: var(--cyan);
    transform: translateX(4px);
    outline: none;
  }

  /* Narrow or portrait: stack, hero on top, list centred under it. */
  @media (max-aspect-ratio: 1/1), (max-width: 760px) {
    :root { --ufs: clamp(14px, 4.4vw, 34px); }
    body { flex-direction: column; gap: clamp(16px, 4vh, 44px); }
    #hero { height: auto; width: min(76vw, 60vh); }
    #sims { align-items: center; }
  }
</style>
</head>
<body>
  <img id="hero" src="/chem2/images/oxygen.png" alt="An oxygen atom, its valence electrons traced out as trails">

  <nav id="sims" aria-label="Unit 2 simulations">
    <a href="/electrons/">ELECTRONS</a>
    <a href="/valence/">VALENCE</a>
    <a href="/bonds/">BONDS</a>
  </nav>
</body>
</html>
