<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSPI Simulations — Chemistry Unit 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
</style>
</head>
<body>
<!-- The HUD frame is shared with /chem1/ — one copy, served from /nucleus/. -->
<img id="allBg" src="/nucleus/images/TitleFull.png" alt=""
     style="position:fixed;inset:0;width:100%;height:100%;object-fit:fill;display:block;">
<div id="allTitleContainer" style="position:fixed;inset:80px;">
  <img id="allTitle" src="/chem2/images/TitleText.jpg" alt="Electrons and Bonds"
       style="width:100%;height:100%;object-fit:contain;display:block;">
  <!-- Hotspots are percentages of the TITLE IMAGE, not the window, so they are
       measured off the artwork: each button's yellow outline, as a fraction of
       the 1486x1059 plate. The script below sizes this box to wherever
       object-fit:contain actually put the image. -->
  <div id="allHotspots" style="position:absolute;pointer-events:none;">
    <a href="/electrons/" aria-label="Electrons" style="position:absolute;pointer-events:all;cursor:pointer;top:39.3%;left:15.2%;width:69.4%;height:12.7%"></a>
    <a href="/valence/"   aria-label="Valence"   style="position:absolute;pointer-events:all;cursor:pointer;top:55.6%;left:15.2%;width:69.6%;height:12.8%"></a>
    <a href="/bonds/"     aria-label="Bonds"     style="position:absolute;pointer-events:all;cursor:pointer;top:72.0%;left:15.1%;width:69.7%;height:12.7%"></a>
  </div>
</div>

<script>
(function() {
  const IMG_W = 1486, IMG_H = 1059;          // the title plate's own pixels
  function positionHotspots() {
    const container = document.getElementById('allTitleContainer');
    const hotspots  = document.getElementById('allHotspots');
    if (!container || !hotspots) return;
    const cw = container.clientWidth, ch = container.clientHeight;
    const scale = Math.min(cw / IMG_W, ch / IMG_H);
    const dw = IMG_W * scale, dh = IMG_H * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    hotspots.style.left   = dx + 'px';
    hotspots.style.top    = dy + 'px';
    hotspots.style.width  = dw + 'px';
    hotspots.style.height = dh + 'px';
  }
  document.getElementById('allTitle').addEventListener('load', positionHotspots);
  window.addEventListener('resize', positionHotspots);
  positionHotspots();
})();
</script>
</body>
</html>
