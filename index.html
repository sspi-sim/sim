<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSPI Simulations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Sampled from the logo artwork, so the page and the image are the same
       field of colour and the logo has no visible edge. */
    --bg:     #050e17;
    --teal:   #3fc8c8;
    --blue:   #4a86c8;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Lexend', system-ui, sans-serif;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vw, 96px);
    padding: clamp(18px, 4vw, 72px);
  }

  /* Big, on the left. Capped by height as well as width (the logo is 920x533,
     ratio 1.726) so it never pushes the list off a short window. */
  #logo {
    flex: 0 1 auto;
    width: min(56vw, 124vh);
    height: auto;
    display: block;
  }

  #units {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.55em;
  }

  #units > a, #units > span {
    display: block;
    color: rgba(255,255,255,0.93);
    text-decoration: none;
    font-size: clamp(13px, 1.95vw, 36px);
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.25;
    white-space: nowrap;
    transition: color 0.18s ease, transform 0.18s ease;
  }

  /* inline, so "Unit 1 Models:" stays on the same line as its title */
  #units .n {
    display: inline;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    margin-right: 0.3em;
  }

  #units > a:hover, #units > a:focus-visible {
    color: var(--teal);
    transform: translateX(3px);
    outline: none;
  }
  #units > a:hover .n, #units > a:focus-visible .n { color: var(--blue); }

  /* Units with no page yet: listed, dimmed, not links. */
  #units > .pending { color: rgba(255,255,255,0.34); cursor: default; }
  #units > .pending .soon { font-weight: 300; font-style: italic; }

  /* Narrow or portrait: stack, logo on top. */
  @media (max-aspect-ratio: 1/1), (max-width: 760px) {
    body { flex-direction: column; gap: clamp(18px, 4vh, 48px); }
    #logo { width: min(86vw, 150vh); }
    #units { align-items: center; }
    #units > a, #units > span { font-size: clamp(13px, 3.6vw, 30px); }
  }
</style>
</head>
<body>
  <img id="logo" src="/images/ssp-logo.png" alt="SSP INTL">

  <nav id="units" aria-label="Units">
    <a href="/chem1/"><span class="n">Unit 1 Models:</span>Nuclear Interactions</a>
    <a href="/chem2/"><span class="n">Unit 2 Models:</span>Electrons and Bonds</a>
    <a href="/chem3/"><span class="n">Unit 3 Models:</span>Concrete and Glass</a>
    <span class="pending"><span class="n">Unit 5 Models:</span><span class="soon">Coming soon</span></span>
    <span class="pending"><span class="n">Unit 6 Models:</span><span class="soon">Coming soon</span></span>
  </nav>
</body>
</html>
