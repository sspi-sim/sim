<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactions Digital Model</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Variables ─────────────────────────────────────────────────────────── */
  :root {
    --accent1:      #ff2d78;
    --accent1-dim:  rgba(255,45,120,0.22);
    --accent1-glow: rgba(255,45,120,0.55);
    --accent2:      #1a6eff;
    --accent2-dim:  rgba(26,110,255,0.18);
    --accent2-glow: rgba(26,110,255,0.45);
    --ui-bg:        rgba(8,6,24,0.42);
    --ui-border:    rgba(255,255,255,0.07);
    --text-dim:     rgba(220,215,255,0.55);
    --text-bright:  rgba(240,235,255,0.92);
  }

  /* ── Reset & base ──────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05040f;
    color: var(--text-bright);
    font-family: 'Lexend', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  button, input, select {
    font-family: 'Lexend', sans-serif;
  }

  /* ── Full-viewport canvas ──────────────────────────────────────────────── */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    display: block;
    z-index: 0;
  }

  /* ── Toolbar — floating glass overlay ─────────────────────────────────── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 20px 10px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* ── Buttons ───────────────────────────────────────────────────────────── */
  .btn {
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }

  /* Go idle (▶) — accent2 themed */
  #goBtn {
    border-color: var(--accent2);
    color: rgba(255,255,255,0.5);
    background: var(--accent2-dim);
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2),
      0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent2),
      0 0 22px var(--accent2-glow),
      0 0 44px var(--accent2-dim);
    display: flex; align-items: center; justify-content: center;
  }
  #goBtn:hover { background: var(--accent2-glow); }
  /* Go running (❙ ❙) — red */
  #goBtn.running {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5),
      0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #goBtn.running:hover { background: rgba(255,40,40,0.3); }

  /* Clear — accent2 themed */
  #clearBtn {
    border-color: var(--accent2);
    color: rgba(255,255,255,0.5);
    background: var(--accent2-dim);
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2),
      0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent2),
      0 0 22px var(--accent2-glow);
  }
  #clearBtn:hover { background: var(--accent2-glow); }

  /* Go / New — squished symbol buttons.
     #goBtn is sized for its widest label ("\u276e\u276e PAUSE"), not its current one, so
     toggling GO/PAUSE never resizes it or shifts Reset underneath. */
  #goBtn, #newBtn { padding: 8px 28px; font-size: 22px; letter-spacing: 2px; }
  #goBtn {
    font-size: 22px;
    letter-spacing: 0;
    padding: 7px 0;
    width: 132px;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
  }

  .temp-btn { width: 58px; text-align: center; white-space: nowrap; }

  /* ========================================
     BUTTON GROUPS — stacked option pickers
     ======================================== */
  .awheel-item {
    display: block;
    padding: 2px 12px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 5px;
    background: transparent;
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: color 0.15s, border-color 0.15s, background 0.15s,
                box-shadow 0.15s, text-shadow 0.15s,
                opacity 0.18s ease, transform 0.22s ease;
  }
  .awheel-item:hover:not(.active) {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 26px var(--accent2-dim);
    text-shadow:
      0 0 6px var(--accent2),
      0 0 14px var(--accent2-glow);
  }
  .awheel-item.active {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 3px var(--accent2),
      0 0 9px var(--accent2-glow),
      0 0 20px var(--accent2-dim);
    text-shadow:
      0 0 5px var(--accent2),
      0 0 12px var(--accent2-glow);
  }

  /* New — neon pink, matches Go */
  #newBtn {
    border-color: var(--accent1);
    color: rgba(255,255,255,0.5);
    background: var(--accent1-dim);
    box-shadow:
      inset 0 0 6px var(--accent1-dim),
      0 0 2px var(--accent1),
      0 0 8px var(--accent1),
      0 0 18px var(--accent1-glow),
      0 0 40px var(--accent1-dim),
      0 0 70px var(--accent1-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent1),
      0 0 22px var(--accent1-glow),
      0 0 44px var(--accent1-dim);
  }
  #newBtn:hover {
    background: var(--accent1-glow);
    box-shadow:
      inset 0 0 10px var(--accent1-glow),
      0 0 4px var(--accent1),
      0 0 14px var(--accent1),
      0 0 28px var(--accent1-glow),
      0 0 60px var(--accent1-dim),
      0 0 100px var(--accent1-dim);
  }

  /* ── Sliders ───────────────────────────────────────────────────────────── */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.10);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 28px var(--accent2-dim);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow:
      0 0 3px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 24px var(--accent2-dim),
      0 0 44px var(--accent2-dim);
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active {
    cursor: grabbing;
    box-shadow:
      0 0 4px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow);
    cursor: grab;
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Launch-speed dial ─────────────────────────────────────────────────── */
  #speedDialWrap { position: relative; display: flex; align-items: center; }

  /* Nothing sets .bounce-warn any more — it was the fission warning that the
     neutron was too slow to split anything. Kept because break mode will want
     the same red flash on the dial when the speed is too low to break a bond. */
  /*
  #speedDialWrap.bounce-warn::before {
    content: '←';
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 700;
    color: #ff2626;
    text-shadow:
      0 0 6px #ff2626,
      0 0 16px rgba(255,38,38,0.9),
      0 0 32px rgba(255,38,38,0.6);
    pointer-events: none;
    animation: speedWarnPulse 0.75s ease-in-out infinite;
    white-space: nowrap;
    line-height: 1;
  }
  #speedDialWrap.bounce-warn::after {
    content: '';
    position: absolute;
    inset: -10px;
    background: rgba(255, 38, 38, 0.72);
    border-radius: 10px;
    filter: blur(18px);
    z-index: -1;
    pointer-events: none;
    animation: speedWarnPulse 0.75s ease-in-out infinite;
  }
  @keyframes speedWarnPulse {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1.0; }
  }
  */
  /* ── Control boxes ─────────────────────────────────────────────────────── */
  .ctrl-box-pink {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 14px;
    background: rgba(255,45,120,0.07);
    border: 1px solid rgba(255,45,120,0.22);
    border-radius: 12px;
    padding: 10px 16px;
    position: relative;
  }
  .ctrl-box-pink input[type="range"] { width: 120px; }
  .ctrl-box-label {
    position: absolute;
    bottom: 100%;
    margin-bottom: 3px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
    pointer-events: none;
  }
  .ctrl-box-label-pink {
    right: 14px;
    color: rgba(255,45,120,0.8);
    text-shadow: 0 0 6px rgba(255,45,120,0.6), 0 0 16px rgba(255,45,120,0.3);
  }
  .ctrl-box-label-blue {
    left: 14px;
    color: var(--accent2);
    opacity: 0.8;
    text-shadow: 0 0 6px var(--accent2-glow), 0 0 16px var(--accent2-dim);
  }

  /* ── NEW button wrapper (the molecule choice dropdown was removed) ────────── */
  .respawn-wrap { position: relative; display: flex; flex-direction: column; align-self: stretch; }

  .ctrl-box-blue {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 18px;
    background: var(--accent2-dim);
    border: 1px solid var(--accent2);
    border-radius: 12px;
    padding: 10px 16px;
    position: relative;
  }
  .ctrl-box-blue input[type="range"] { width: 150px; }
  .ctrl-box-blue .slider-icon { font-size: 28px; }
  .ctrl-box-blue .toggle-label { font-size: 13px; gap: 6px; }
  .ctrl-box-blue .field-label-electric { font-size: 13px; }
  .ctrl-box-blue .awheel-item { font-size: 14px; padding: 5px 14px; }
  .slider-group label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .slider-group label span {
    display: inline-block;
    min-width: 3em;
    text-align: right;
    color: var(--accent2);
    text-shadow: 0 0 5px var(--accent2-glow);
  }
  .slider-group input[type="range"] { width: 80px; }

  .slider-icon {
    font-size: 18px;
    line-height: 1;
    user-select: none;
    filter:
      brightness(0) invert(1)
      blur(0.5px)
      opacity(0.65)
      drop-shadow(0 0 4px var(--accent2))
      drop-shadow(0 0 12px var(--accent2))
      drop-shadow(0 0 24px var(--accent2-glow));
  }

  /* ── Toggle labels ─────────────────────────────────────────────────────── */
  .toggle-label {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .toggle-label input[type="checkbox"] { accent-color: var(--accent1); }

  .field-label-electric {
    color: #46a5ff;
    text-shadow:
      0 0 4px #46a5ff,
      0 0 10px rgba(70,165,255,0.5),
      0 0 22px rgba(70,165,255,0.2);
  }

  /* ── Scrub bar — floating glass at bottom ──────────────────────────────── */
  #energyBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: none;
    flex-direction: row;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--ui-border);
    box-shadow: 0 -1px 0 var(--accent1-dim), 0 -4px 20px rgba(0,0,0,0.5);
  }
  #energyBar.visible { display: flex; }
  /* Left panel: key labels + replay/clock controls */
  #energyBarLeft {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    flex-shrink: 0;
    width: 112px;
    border-right: 1px solid var(--ui-border);
  }
  #energyGraphKey {
    display: none;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    justify-content: center;
    padding: 0 8px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.02em;
  }
  #energyGraphKey.visible { display: flex; }
  #energyBarClock {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 80px;
    padding: 0 8px;
    flex-shrink: 0;
  }
  /* Right panel: energyMain (graph+slider) + energyReadout (pct+toggle) */
  #energyBarRight {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: row;
  }
  #energyMain {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 6px 0;
  }
  #energyBarButtons {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 80px;
    padding: 0 12px;
    flex-shrink: 0;
    margin-top: auto;
  }
  #energyGraphBox {
    display: none;
    flex-direction: column;
    border-bottom: 1px solid rgba(26,110,255,0.25);
    background: rgba(26,110,255,0.04);
  }
  #energyGraphBox.visible { display: flex; }
  #energyPercents {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 12px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  #energyPercents.visible { display: flex; }
  #energyPctNums {
    display: flex;
    gap: 10px;
  }
  #energyPctNote {
    font-size: 12px;
    color: #ff3a6e;
    text-align: center;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  #energyGraphToggle {
    border: 1px solid var(--accent2);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--accent2-dim);
    color: rgba(255,255,255,0.5);
    font-family: inherit;
    flex: 1;
    line-height: 1.25;
    padding: 6px 10px;
    text-align: center;
    white-space: normal;
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2), 0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow), 0 0 40px var(--accent2-dim);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px var(--accent2);
    transition: all 0.2s;
  }
  #energyGraphToggle:hover { background: var(--accent2-glow); }
  #energyGraphToggle.active {
    box-shadow:
      inset 0 0 8px var(--accent2-dim),
      0 0 4px var(--accent2), 0 0 14px var(--accent2),
      0 0 28px var(--accent2-glow), 0 0 55px var(--accent2-dim);
  }
  #energyGraph {
    display: block;
    width: 100%;
    height: 110px;
    cursor: crosshair;
  }

  .theme-btn {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    box-shadow: none;
  }
  .theme-btn:hover { transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .theme-btn.active {
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 6px rgba(255,255,255,0.4), 0 0 14px rgba(255,255,255,0.15);
  }
  #themeA { background: #1a6eff; }
  #themeB { background: #bd00ff; }
  #themeC { background: #00f5e0; }
  #themeLight { background: #fff; }
  #bgColorPicker { display:none; width:22px; height:22px; padding:2px; border-radius:4px; border:1px solid rgba(0,0,0,0.25); cursor:pointer; vertical-align:middle; margin-left:4px; }
  body.screenshot-mode #bgColorPicker { display:inline-block; }
  body.screenshot-mode #themeLight { display: none; }
  body.screenshot-mode { background: var(--bg-color, #fff) !important; }
  body.screenshot-mode #toolbar { background: rgba(255,255,255,0.42) !important; box-shadow: none !important; }
  body.screenshot-mode #toolbar,
  body.screenshot-mode #toolbar * {
    color: #000 !important;
    text-shadow: none !important;
  }
  body.screenshot-mode #toolbar button {
    border-color: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode input[type="range"] {
    box-shadow: none !important;
    background: rgba(0,0,0,0.15) !important;
  }
  body.screenshot-mode input[type="range"]::-webkit-slider-thumb {
    background: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode input[type="range"]::-moz-range-thumb {
    background: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode .slider-icon {
    filter: brightness(0) !important;
    opacity: 1 !important;
  }
  body.screenshot-mode #bugReportBtn .slider-icon {
    filter: drop-shadow(0 0 5px rgba(200,0,0,0.8)) drop-shadow(0 0 14px rgba(180,0,0,0.5)) !important;
    background: rgba(210,210,210,0.85) !important;
  }
  body.screenshot-mode #qualitySelect {
    background: rgba(220,220,220,0.5) !important;
    color: rgba(0,0,0,0.35) !important;
    border-color: rgba(0,0,0,0.12) !important;
  }
  body.screenshot-mode #energyBar {
    background: rgba(255,255,255,0.42) !important;
    border-top-color: rgba(0,0,0,0.15) !important;
    box-shadow: none !important;
  }
  body.screenshot-mode #energyBar,
  body.screenshot-mode #energyBar * { color: #000 !important; text-shadow: none !important; }
  body.screenshot-mode #energyBar button { border-color: #000 !important; box-shadow: none !important; }
  body.screenshot-mode #energyGraph { background: #fff !important; }
  /* Preserve the educational colour code: energy in fields = blue */
  body.screenshot-mode .field-label-electric { color: #46a5ff !important; }
  body.screenshot-mode img[alt="logo"] { display: none !important; }

  /* ── Quality select ──────────────────────────────────────────────────────── */
  #qualitySelect {
    background: rgba(10,8,20,0.5); color: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.04); border-radius: 4px;
    padding: 2px 4px; font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #qualitySelect:focus { outline: 1px solid rgba(255,100,100,0.4); }
  #qualitySelect:hover { color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.18); }

</style>
</head>
<body>

<canvas id="canvas"></canvas>


<div id="toolbar">
  <div class="toolbar-row">
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
      <select id="qualitySelect">
        <option value="hi-res">Hi-res</option>
        <option value="detailed">Detailed</option>
        <option value="simple">Simple</option>
      </select>
      <button class="theme-btn active" id="themeA" title="Synthwave"></button>
      <button class="theme-btn" id="themeB" title="Industrial"></button>
      <button class="theme-btn" id="themeC" title="Neon Blue"></button>
      <button class="theme-btn" id="themeLight" title="Light mode"></button>
<input type="color" id="bgColorPicker" value="#ffffff" title="Background color">

<div id="bugModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(2,1,12,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;">
