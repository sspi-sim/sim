<script>
// REACTIONS — a molecular collision sandbox. One file, no build step.
//
// The sections below, in the order they appear. Each only uses what is above it,
// apart from the controls and Init at the foot, which wire up everything.
//
//   Constants, Elements     atom radius, bond length, the periodic data we use
//   Canvas, Quality tiers   the two canvases, the draw-cost benchmark, frame cap
//   Colormaps, Field        energy in fields: the glowing lobe inside each bond
//   Atom renderer           drawAtom: a circle traced by a travelling arrow
//   Molecule outline        the union silhouette, for Outline view
//   Species, World          what can be spawned, and the wrap-around box
//   Temperature             the Low/High dial and its exponential ramp
//   Spawn speed spread      the truncated bell that speeds start from
//   Physics                 stepWorld + collidePair: rigid-body impulse with spin
//   Speed band              settlePairSpeeds: deliberately not pure
//   Formula readout         ['H','H'] -> 'H₂', and the species counters
//   Icons                   the toolbar canvases
//   Renderer, Main loop     drawWorld and worldLoop
//   Energy trace            the scrolling energy-of-motion graph
//   Controls, Dev panel     event wiring; type "dev" for the experiment knobs
//   Themes                  the four colour schemes
//   Console diagnostics     runPerfTest / speedHistogram / energySplit
//   Init                    start-up order, then the bug-report button
//
// Vocabulary: an ATOM is one circle, a MOLECULE is a rigid BODY of atoms, a
// SPECIES is a recipe for one (H2, O2). Energy is "energy of motion" and
// "energy in fields" throughout — the same words the UI uses.

// ─── Constants ────────────────────────────────────────────────────────────────
// ATOM_RADIUS is the drawn radius of one hydrogen atom. Nearly all the scene
// geometry — bond lengths, outlines, icon scaling — is expressed as a multiple
// of it, so bumping it here scales the whole scene.
const ATOM_RADIUS = 30;

// ─── Elements ─────────────────────────────────────────────────────────────────
// rScale ≈ van der Waals radius relative to hydrogen (H 1.20 Å, O 1.52 Å).
// No charge here: the field view draws bonds, not charges, so a partial charge
// per atom would be a number nothing reads. The charge-attraction work will
// want electronegativity (H 2.20, O 3.44) rather than a hand-set q.
const ELEMENTS = {
  H:  { label: 'H',  rgb: '185,192,205', rScale: 1.00 },   // grey
  O:  { label: 'O',  rgb: '232,56,47',   rScale: 1.27 },   // red
  He: { label: 'He', rgb: '127,219,232', rScale: 1.17 },   // pale cyan — noble
};
const DEFAULT_ELEMENT = 'H';
function elemOf(p) { return ELEMENTS[p.el] || ELEMENTS[DEFAULT_ELEMENT]; }
const rgba = (rgb, a) => `rgba(${rgb},${a})`;

// Centre-to-centre bond length, as a fraction of the two atoms' radii summed:
// < 1 so bonded atoms visibly overlap the way a space-filling model does.
const BOND_OVERLAP = 0.72;
function bondLen(elA, elB) {
  return (ELEMENTS[elA].rScale + ELEMENTS[elB].rScale) * ATOM_RADIUS * BOND_OVERLAP;
}

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const graphCanvas = document.getElementById('energyGraph');
const graphCtx    = graphCanvas.getContext('2d');

// ─── Field heatmap buffers ────────────────────────────────────────────────────
// The field is accumulated as floats at low resolution, then colour-mapped once
// and blitted up to world size. There is no cache: every molecule moves every
// frame, so a cached composite could never be reused.
const fieldCanvas = document.createElement('canvas');
const fieldCtx    = fieldCanvas.getContext('2d');

let fieldW = 0, fieldH = 0;
let fieldAcc = null;    // Float32Array, the summed lobes
let fieldPix = null;    // Uint8ClampedArray behind fieldImg
let fieldImg = null;

// ── Quality tiers ─────────────────────────────────────────────────────────────
// Each tier sets both how much is drawn per atom and the frame rate it is drawn
// at. 60 fps is plenty for this sim; the light tier settles for 30 so a weak
// machine spends its budget on a steady picture rather than a stuttering one.
const TIER_FPS = { 'hi-res': 60, 'detailed': 60, 'simple': 30 };

let _quality = 'hi-res';            // 'hi-res' | 'detailed' | 'simple'
let frameBudgetMs = 1000 / 60;      // minimum wall time between drawn frames

function _applyQuality(level) {
  _quality = level;
  frameBudgetMs = 1000 / (TIER_FPS[level] || 60);
  const el = document.getElementById('qualitySelect');
  if (el) el.value = level;
}

// ── Renderer benchmark ────────────────────────────────────────────────────────
// Prices what the sim actually draws — the valence-electron trails, which are
// far and away the biggest cost now. One pass is the heaviest world the sliders
// can make: 6 H2 + 6 O2, which is 6x2 + 6x12 = 84 electrons. Pricing it as
// all-O2 would be 144 and would talk a capable machine down a tier for no
// reason. getImageData() at the end forces a GPU sync so the timing is real.
const BENCH_WORLD = [['H', 'H'], ['O', 'O']];   // 6 of each, as the sliders cap it

function _runPerfBenchmark() {
  const oc = document.createElement('canvas');
  oc.width = 640; oc.height = 420;
  const dc = oc.getContext('2d');
  const saved = _quality;
  _quality = 'hi-res';                 // always price the heaviest tier

  // Synthetic bodies, filled trails, laid out across the offscreen canvas
  const bodies = Array.from({ length: 12 }, (_, i) => {
    const b = withElectrons(makeBody(BENCH_WORLD[i % 2], 0, 0, 0, 0, 0, 1));
    b.x = 60 + (i % 4) * 150; b.y = 70 + Math.floor(i / 4) * 130;
    b.angle = i * 0.7;
    for (const e of b.electrons) {
      for (let t = 0; t < TRAIL_MAX; t++) {
        e.tx[t] = Math.cos(t * 0.3) * 40; e.ty[t] = Math.sin(t * 0.3) * 25;
      }
      e.n = TIER_TRAIL_LEN['hi-res']; e.head = 0;
    }
    return b;
  });
  const pass = () => bodies.forEach(b => drawElectrons(b, dc));

  pass();                              // warm-up: settle JIT, GPU init, glow cache
  dc.getImageData(0, 0, 1, 1);
  const t0 = performance.now();
  for (let r = 0; r < 3; r++) pass();
  dc.getImageData(0, 0, 1, 1);         // force GPU flush so timing is real
  const ms = (performance.now() - t0) / 3;

  _quality = saved;
  return ms;
}

// Calibrated against measured draw cost at a full 6+6 world on a 2024 laptop:
// hi-res ~1.3 ms, detailed ~0.7 ms, simple ~0.45 ms per frame. The thresholds
// sit well above those so an ordinary machine gets hi-res and only a genuinely
// slow one steps down; drawing is not the only thing a 16.7 ms frame must do.
const TIER_THRESHOLD_MS = { 'hi-res': 6.0, 'detailed': 14.0 };

function pickTier(ms) {
  if (ms < TIER_THRESHOLD_MS['hi-res'])   return 'hi-res';
  if (ms < TIER_THRESHOLD_MS['detailed']) return 'detailed';
  return 'simple';
}

function resize() {
  canvas.width   = window.innerWidth;
  canvas.height  = window.innerHeight;
  graphCanvas.width  = Math.max(1, graphCanvas.offsetWidth || (window.innerWidth - 112));
  graphCanvas.height = 110;
}
resize();
// Re-fit the walled box to the band between the toolbar and the energy bar,
// carrying the molecules with it so nothing is left outside a wall or stacked
// on top of something else. Needed whenever that band changes height — a window
// resize, or showing/hiding the line graph, which makes the energy bar taller
// or shorter.
function restretchWorld() {
  const { oldW, oldH } = syncWorldBox();
  if (oldW <= 0 || oldH <= 0) return;
  for (const b of world.bodies) {
    b.x = Math.min(world.w - b.radius, Math.max(b.radius, b.x * world.w / oldW));
    b.y = Math.min(world.h - b.radius, Math.max(b.radius, b.y * world.h / oldH));
  }
}

window.addEventListener('resize', () => {
  resize();
  document.getElementById('energyBar').classList.add('visible');
  restretchWorld();
});

// ─── Colormaps ────────────────────────────────────────────────────────────────
function buildColorstops(stops, out) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s+1].t) { s0 = stops[s]; s1 = stops[s+1]; break; }
    }
    const f   = (s1.t === s0.t) ? 0 : (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    out[idx]   = s0.r + (s1.r - s0.r) * f;
    out[idx+1] = s0.g + (s1.g - s0.g) * f;
    out[idx+2] = s0.b + (s1.b - s0.b) * f;
    out[idx+3] = s0.a + (s1.a - s0.a) * f;
  }
}

const COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 10,  g: 35,  b: 170, a: 140 },
  { t: 0.4,  r: 25,  g: 85,  b: 235, a: 210 },
  { t: 0.7,  r: 70,  g: 165, b: 255, a: 245 },
  { t: 1.0,  r: 210, g: 238, b: 255, a: 255 },
], COLORMAP);

// ─── Energy in fields — the lobe between two bonded atoms ───────────────────
// Deliberately a picture, not a calculation. The reasoning it has to carry is
// one sentence: a bond is two nuclei both pulled toward the space between them,
// because that is where the shared electrons spend their time. So the lobe is
// drawn BETWEEN the atoms, zero at each nucleus and brightest at the midpoint.
//
// No partial charges, no test probe, no electron cloud. Anything more detailed
// would be modelling, and this is here to explain, not to compute. When the bar
// charts arrive they do their own arithmetic; the two are the same idea, not the
// same numbers.
//
// (This replaces fission's pair heatmap, which drew a tube between every pair of
// protons in a nucleus. The lens shape survived the port almost unchanged — it
// was already a good picture of a bond, pointed at the wrong thing.)

// Bond dissociation energies, kJ/mol. Brightness is scaled by these, so O=O sits
// slightly above H–H. Break mode will want exactly this table to decide what an
// impact is strong enough to pull apart.
const BOND_ENERGY = { 'H-H': 436, 'H-O': 463, 'O-O': 498 };
const BOND_ENERGY_MAX = 498;
function bondEnergy(elA, elB) {
  return BOND_ENERGY[[elA, elB].sort().join('-')] || 400;
}

const FIELD_SCALE = { 'hi-res': 0.30, 'detailed': 0.20, 'simple': 0.12 };
let FIELD_WIDTH = 0.30;     // lobe half-width as a fraction of the bond length
// Lower is brighter: the accumulated value that maps to the top of the colormap.
// A bond at rest peaks at its own energy over the strongest bond — 0.88 for H-H,
// 1.00 for O=O — so 0.9 sits the resting bonds right at the top of the ramp
// without clipping (H2 saturates 0 pixels, O2 a bare 9 at its very core). A
// collision then drives the peak to 2.7-4.0, and because that is past the top of
// the ramp the flare reads as a white core SPREADING through the lobe rather
// than as the lobe simply getting brighter.
let FIELD_GAIN = 0.9;

// A collision flare: the struck bond brightens and squeezes for a moment, then
// relaxes. Driven by the collision impulse, so a hard hit flares harder. This is
// the only thing that moves until molecules can actually vibrate.
let FLARE_GAIN      = 3.0;   // extra brightness at flare = 1
const FLARE_SQUEEZE = 0.25;  // how much the lobe narrows at flare = 1
const FLARE_TAU     = 0.30;  // seconds to decay

function ensureFieldBuffers(w, h) {
  if (fieldW === w && fieldH === h) return;
  fieldW = w; fieldH = h;
  fieldCanvas.width = w; fieldCanvas.height = h;
  fieldAcc = new Float32Array(w * h);
  fieldPix = new Uint8ClampedArray(w * h * 4);
  fieldImg = new ImageData(fieldPix, w, h);
}

// Every bond in the world as a world-space segment.
function bondSegments() {
  const segs = [];
  for (const b of world.bodies) {
    const bright  = 1 + FLARE_GAIN * b.flare;
    const squeeze = 1 - FLARE_SQUEEZE * b.flare;
    const at = bodyAtoms(b);
    for (const [i, k] of b.bonds) {
      segs.push({
        x1: at[i].x, y1: at[i].y, x2: at[k].x, y2: at[k].y,
        mag: bondEnergy(at[i].el, at[k].el) / BOND_ENERGY_MAX * bright,
        squeeze,
      });
    }
  }
  return segs;
}

function drawFieldHeatmap(destCtx) {
  const segs = bondSegments();
  if (!segs.length) return;

  const scale = FIELD_SCALE[_quality] || 0.2;
  const w = Math.max(1, Math.ceil(world.w * scale));
  const h = Math.max(1, Math.ceil(world.h * scale));
  ensureFieldBuffers(w, h);
  fieldAcc.fill(0);
  const inv = 1 / scale;

  for (const s of segs) {
    const sdx = s.x2 - s.x1, sdy = s.y2 - s.y1;
    const L = Math.hypot(sdx, sdy);
    if (L < 1e-6) continue;
    const ux = sdx / L, uy = sdy / L;
    const sigma  = L * FIELD_WIDTH * s.squeeze;
    const twoSig = 2 * sigma * sigma;
    const cullSq = twoSig * 3;                 // past here the gaussian is < 5%
    const reach  = sigma * 2.5;

    // Only the pixels this one lobe can reach — a box about a bond long
    const x0 = Math.max(0,     Math.floor((Math.min(s.x1, s.x2) - reach) * scale));
    const x1 = Math.min(w - 1, Math.ceil ((Math.max(s.x1, s.x2) + reach) * scale));
    const y0 = Math.max(0,     Math.floor((Math.min(s.y1, s.y2) - reach) * scale));
    const y1 = Math.min(h - 1, Math.ceil ((Math.max(s.y1, s.y2) + reach) * scale));

    for (let py = y0; py <= y1; py++) {
      const wy = py * inv - s.y1;
      for (let px = x0; px <= x1; px++) {
        const wx = px * inv - s.x1;
        const along = wx * ux + wy * uy;        // distance along the bond axis
        if (along < 0 || along > L) continue;   // nothing outside the two nuclei
        const perpSq = wx * wx + wy * wy - along * along;
        if (perpSq > cullSq) continue;
        // sin() puts zero at each nucleus and the peak exactly between them
        const lobe = Math.sin(Math.PI * (along / L));
        fieldAcc[py * w + px] += s.mag * lobe * Math.exp(-perpSq / twoSig);
      }
    }
  }

  for (let i = 0, n = w * h; i < n; i++) {
    const v = fieldAcc[i];
    if (v <= 0.002) { fieldPix[i * 4 + 3] = 0; continue; }
    const c = Math.min(255, (v / FIELD_GAIN * 255) | 0) * 4;
    const d = i * 4;
    fieldPix[d] = COLORMAP[c]; fieldPix[d + 1] = COLORMAP[c + 1];
    fieldPix[d + 2] = COLORMAP[c + 2]; fieldPix[d + 3] = COLORMAP[c + 3];
  }

  fieldCtx.putImageData(fieldImg, 0, 0);
  destCtx.save();
  destCtx.imageSmoothingEnabled = true;        // the upscale is what softens it
  destCtx.imageSmoothingQuality = 'high';
  destCtx.drawImage(fieldCanvas, 0, 0, world.w, world.h);
  destCtx.restore();
}

// ─── Space-filling view ───────────────────────────────────────────────────────
// The "Outline" mode. Each atom is a sphere at its van der Waals radius, so a
// molecule reads as one continuous layer of matter with its nuclei just showing
// through. Two edges are drawn: the molecule's outer silhouette, and the SEAM —
// the circle where two sphere surfaces actually intersect. Nothing is lit
// beyond a little limb darkening; there is no highlight.
//
// The spheres go into a scratch layer at full opacity and the WHOLE LAYER is
// blitted once at `sphereOpacity`. Drawing them straight onto the scene would
// composite the overlaps twice, so every place two atoms meet would come out
// darker than the rest and the molecule would look seamed instead of solid.

let sphereOpacity = 0.80;      // 1 = solid; 0.80 is "20% transparent\"

const _sphereLayer = document.createElement('canvas');
const _sphereCtx   = _sphereLayer.getContext('2d');

// One atom's body: the element's flat colour, then limb darkening — a gentle
// fade to dark at the rim, centred a little up and left. No specular highlight
// and no bright side; just enough falloff to say "ball" instead of "disc".
//
// No outline here. The edges are drawn afterwards, per molecule: the outer
// silhouette once, and then the seam (see `drawSeams`).
function drawSphere(c, p) {
  const e = elemOf(p);
  const r = ATOM_RADIUS * e.rScale;
  const TAU = Math.PI * 2;

  c.fillStyle = rgba(e.rgb, 1);
  c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill();

  if (sphereDepth > 0) {
    const g = c.createRadialGradient(p.x - r * 0.22, p.y - r * 0.22, r * 0.20,
                                     p.x, p.y, r * 1.02);
    g.addColorStop(0,    'rgba(0,0,0,0)');
    g.addColorStop(0.60, `rgba(0,0,0,${(0.08 * sphereDepth).toFixed(3)})`);
    g.addColorStop(1,    `rgba(0,0,0,${(0.52 * sphereDepth).toFixed(3)})`);
    c.fillStyle = g;
    c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill();
  }
}

// Where two SPHERES meet, their surfaces cross in a CIRCLE — not in the lens
// the two flat discs make. That circle lies in the plane perpendicular to the
// bond, so on screen it is an ellipse: full width across the bond, squashed
// along it by however far the bond is tilted out of the screen.
//
//   d  = centre separation           a = (d² + rA² − rB²) / 2d   (A → chord)
//   h  = √(rA² − a²)                 the circle's true radius
//
// A bond lying exactly in the screen plane would project the circle to a bare
// line, which is the "overlap" look we are trying to get away from, so the view
// is given a fixed tilt and every seam is drawn at it.
let seamTilt = 0.34;     // 0 = edge-on (a line); 1 = face-on (a full circle)

function drawSeams(c, circles) {
  const TAU = Math.PI * 2;
  for (let i = 0; i < circles.length; i++) {
    for (let j = i + 1; j < circles.length; j++) {
      const A = circles[i], B = circles[j];
      const dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.hypot(dx, dy);
      if (d >= A.r + B.r || d <= Math.abs(A.r - B.r) || d === 0) continue;  // apart, or one swallowed
      const a = (d * d + A.r * A.r - B.r * B.r) / (2 * d);
      const h2 = A.r * A.r - a * a;
      if (h2 <= 0) continue;
      const h = Math.sqrt(h2);
      const ux = dx / d, uy = dy / d;                 // along the bond
      const mx = A.x + ux * a, my = A.y + uy * a;     // chord midpoint
      const rot = Math.atan2(uy, ux);
      c.beginPath();
      c.ellipse(mx, my, h * seamTilt, h, rot, 0, TAU);
      c.stroke();
    }
  }
}

function atomCircles(atoms) {
  return atoms.map(p => ({ x: p.x, y: p.y, r: ATOM_RADIUS * elemOf(p).rScale }));
}

// The molecule's outer edge, as arc runs: each atom's circle only where it is
// not buried inside another. Overlapping atoms give one outline rather than a
// pile of rings, and nothing is ever drawn where two atoms cross.
function silhouetteRuns(circles) {
  const runs = [];
  const STEPS = 96;
  for (const a of circles) {
    let runStart = null;
    for (let k = 0; k <= STEPS; k++) {
      const th = k / STEPS * Math.PI * 2;
      const px = a.x + a.r * Math.cos(th), py = a.y + a.r * Math.sin(th);
      // The closing sample is always treated as "inside" so the last run flushes
      const buried = k === STEPS || circles.some(b =>
        b !== a && Math.hypot(px - b.x, py - b.y) < b.r);
      if (!buried && runStart === null) runStart = th;
      else if (buried && runStart !== null) {
        runs.push({ x: a.x, y: a.y, r: a.r, a0: runStart, a1: th });
        runStart = null;
      }
    }
  }
  return runs;
}

function strokeRuns(c, runs) {
  for (const r of runs) { c.beginPath(); c.arc(r.x, r.y, r.r, r.a0, r.a1); c.stroke(); }
}

// How much the spheres are modelled: limb darkening and edge strength. 0 is a
// perfectly flat disc.
let sphereDepth = 0.40;

// A thin rim for definition. No glow: shadowBlur in a per-atom path is what
// cost 8.3 ms a frame here.
function drawMoleculeRim(c, runs) {
  const LIGHT = document.body.classList.contains('screenshot-mode');
  c.save();
  c.strokeStyle = LIGHT ? 'rgba(0,0,0,0.50)' : 'rgba(255,255,255,0.22)';
  c.lineWidth   = 1.5;
  strokeRuns(c, runs);
  c.restore();
}

function drawSpaceFilling() {
  // Nuclei first: the sphere layer lands on top of them, so what shows through
  // is exactly 1 - sphereOpacity of each. That is the "slightly visible" part.
  for (const b of world.bodies)
    for (const p of bodyAtoms(b)) drawNucleus(ctx, p.x, p.y);

  if (_sphereLayer.width !== canvas.width || _sphereLayer.height !== canvas.height) {
    _sphereLayer.width = canvas.width; _sphereLayer.height = canvas.height;
  }
  _sphereCtx.setTransform(1, 0, 0, 1, 0, 0);
  _sphereCtx.clearRect(0, 0, _sphereLayer.width, _sphereLayer.height);
  _sphereCtx.setTransform(ctx.getTransform());     // match the world zoom/pan
  const runsFor = [];
  for (const b of world.bodies) {
    const atoms = bodyAtoms(b);
    const circles = atomCircles(atoms);
    const runs = silhouetteRuns(circles);
    runsFor.push(runs);
    // Bodies first, then the edges on top of them — all inside the layer, so
    // every part is covered by the same uniform alpha as the matter it belongs
    // to. The outer edge is the silhouette only: no arc runs through an
    // overlap, because what belongs there is the seam circle, not two arcs.
    for (const p of atoms) drawSphere(_sphereCtx, p);
    _sphereCtx.strokeStyle = `rgba(0,0,0,${(0.30 + 0.25 * sphereDepth).toFixed(3)})`;
    _sphereCtx.lineWidth   = 1.2;
    strokeRuns(_sphereCtx, runs);
    _sphereCtx.strokeStyle = `rgba(0,0,0,${(0.22 + 0.20 * sphereDepth).toFixed(3)})`;
    _sphereCtx.lineWidth   = 1.0;
    drawSeams(_sphereCtx, circles);
  }

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);              // the layer is already in place
  ctx.globalAlpha = sphereOpacity;
  ctx.drawImage(_sphereLayer, 0, 0);
  ctx.restore();

  runsFor.forEach(runs => drawMoleculeRim(ctx, runs));
}

// ─── Atom glow sprite ─────────────────────────────────────────────────────────
// Arrowhead glow. Canvas shadowBlur costs ~8 ms a frame at a full world — it was
// 88% of the whole hi-res draw — so the halo is a radial-gradient sprite baked
// once per element and colour and then just blitted.
const _glowCache = new Map();
function glowSprite(rgb, R) {
  const size = Math.max(8, Math.round(R * 3));
  const key = rgb + '|' + size;
  let c = _glowCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = c.height = size;
  const gc = c.getContext('2d');
  const grad = gc.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0.00, rgba(rgb, 0.50));
  grad.addColorStop(0.40, rgba(rgb, 0.20));
  grad.addColorStop(1.00, rgba(rgb, 0));
  gc.fillStyle = grad;
  gc.fillRect(0, 0, size, size);
  _glowCache.set(key, c);
  return c;
}

// ─── Nucleus — one proton, from the fission renderer ────────────────────────
// Lifted from fission's drawParticles: the same pink sphere (#ff1a65 shell,
// #ff80b0 core) with a white "+", shrunk to a dot in the middle of each atom.
// One proton stands in for the whole nucleus — an oxygen really has eight, but
// this is a marker saying "the positive charge lives here", not a count.
//
// Fission drew it live with a radial gradient and shadowBlur per particle.
// shadowBlur in a per-atom path is what cost 8.3 ms a frame here, so the whole
// thing — halo, sphere and "+" — is baked once into a sprite and blitted. The
// blur happens at bake time, where paying for it once is fine.
const NUCLEUS_DIAMETER = 10;      // px; dev slider
let nucleusDiameter = NUCLEUS_DIAMETER;

const _protonCache = new Map();
function protonSprite(d) {
  const key = d.toFixed(1);
  let c = _protonCache.get(key);
  if (c) return c;
  const R = d / 2;
  const pad = Math.ceil(R * 1.6);               // room for the halo
  const size = Math.ceil(d + pad * 2);
  c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const m = size / 2;

  // Shell, fading out at the rim
  const shell = g.createRadialGradient(m, m, 0, m, m, R * 1.1);
  shell.addColorStop(0,    '#ff1a65');
  shell.addColorStop(0.82, '#ff1a65');
  shell.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = shell;
  g.beginPath(); g.arc(m, m, R * 1.1, 0, Math.PI * 2); g.fill();

  // Bright core with its halo — the one shadowBlur, paid once per size
  const core = g.createRadialGradient(m, m, 0, m, m, R);
  core.addColorStop(0,   '#ff80b0');
  core.addColorStop(0.5, '#ff80b0');
  core.addColorStop(1,   'rgba(0,0,0,0)');
  g.save();
  g.shadowColor = '#ff80b0';
  g.shadowBlur  = Math.max(3, R * 1.6);
  g.globalAlpha = 0.82;
  g.fillStyle = core;
  g.beginPath(); g.arc(m, m, R, 0, Math.PI * 2); g.fill();
  g.restore();

  // The "+" that marks it positive. Below about 4 px it is a smudge, so at that
  // size it is left off rather than drawn as noise.
  if (d >= 8) {
    g.fillStyle = 'rgba(255,255,255,0.88)';
    g.font = `bold ${Math.max(6, Math.round(d * 1.1))}px Lexend, sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('+', m, m + d * 0.1);
  }

  _protonCache.set(key, c);
  return c;
}

function drawNucleus(dc, px, py, scale = 1, alpha = 1) {
  const d = nucleusDiameter * scale;
  if (d < 1.5) return;
  const sp = protonSprite(d);
  dc.save();
  dc.globalAlpha = alpha;
  dc.drawImage(sp, px - sp.width / 2, py - sp.height / 2);
  dc.restore();
}

// ─── Valence electrons ────────────────────────────────────────────────────────
// Ported from the `bonds` repo's Trails view. Each valence electron is a moving
// point that pays out a fading trail with an arrowhead at its head — the arrow
// is the electron, and the trail is where it has just been.
//
// ONLY the valence shell is modelled. Inner shells are ignored entirely: they
// take no part in bonding and would be a crowd of circles around every nucleus.
//
// Two kinds of electron, which is the whole idea:
//
//   BONDING  — shared by two atoms, running a lemniscate (figure-8) whose two
//              lobes wrap the two nuclei and whose crossing is the bond midpoint.
//              This is what makes a bond look like a bond: one path, two atoms.
//   LONE     — not in any bond, orbiting its own nucleus on the valence shell.
//              Two helium atoms have nothing but these, and never bond.
//
// Everything is held in BODY-LOCAL coordinates and transformed at draw time, so
// a molecule can translate and spin without smearing or rebuilding its trails.

// Helium's shell is full, so it bonds with nothing: a He body has no bonds and
// its two electrons stay lone. That is the non-bonding case the renderer has to
// handle, and the reason He is here at all.
const VALENCE   = { H: 1, O: 6, He: 2 };                // outer-shell electrons
const BOND_ORDER = { 'H-H': 1, 'H-O': 1, 'O-O': 2 };    // 2 = double bond
function bondOrder(elA, elB) {
  return BOND_ORDER[[elA, elB].sort().join('-')] || 1;
}

// Trail detail per tier. This is the whole cost of the view: one stroke per
// bucket per electron, every frame.
const TIER_BUCKETS   = { 'hi-res': 10, 'detailed': 6, 'simple': 3 };
const TIER_TRAIL_LEN = { 'hi-res': 48, 'detailed': 32, 'simple': 18 };
const TRAIL_MAX = 64;             // ring-buffer size; the largest tier length

// Tuning, carried over from bonds and kept adjustable (dev sliders)
let eSpeed      = 0.50;   // phase advance per frame at 60 fps
let eSteer      = 0.30;   // how hard the electron is pulled onto the ideal path
let eCrossSlow  = 0.50;   // speed multiplier at the bond midpoint crossing
let eTrailScale = 1.0;    // multiplies the tier's trail length
let showLonePairs = true; // non-bonding valence electrons on/off

// A bare lemniscate is a narrow bow tie: its widest half-width is a/(2*sqrt 2),
// about 0.354 of the lobe's reach. `eWidth` stretches it across the bond, and
// 1.41 is the value that makes a lobe exactly as wide as it is long — a circle
// round the nucleus, which is what a bonding pair should look like it is doing.
let eWidth      = 1.45;   // perpendicular stretch; 1 = bare lemniscate

// Pass-to-pass variability. All three are re-rolled at every lobe, so no two
// laps of the figure-8 lie on top of each other and the trail reads as a cloud
// rather than a wire. They are plus-or-minus fractions, applied directly.
let eRadial     = 0.26;   // +-: how far the lobe reaches past the nucleus
let eWander     = 0.30;   // +-: how wide the lobe is
let eTilt       = 0.17;   // +- radians: lobe swing off the bond axis
let eRoll       = 0.12;   // how fast a re-rolled target is taken up (per frame)

function valenceRadius(el) { return ATOM_RADIUS * ELEMENTS[el].rScale; }

function makeElectron(kind, el) {
  return {
    kind, el,
    // live position and velocity, body-local
    x: 0, y: 0, vx: 0, vy: 0,
    phase: 0, visit: 0,
    effR: 0, effW: 0, effT: 0, targetR: 0, targetW: 0, targetT: 0, prevVisit: -1,
    // ring-buffer trail, body-local
    tx: new Float32Array(TRAIL_MAX), ty: new Float32Array(TRAIL_MAX),
    n: 0, head: 0,
    // lone-electron state: just where it is on its circle
    angle: 0,
  };
}

// Build the valence shell for one body: bonding electrons on each bond, then
// whatever each atom has left over orbiting on its own.
function buildElectrons(b) {
  const list = [];
  const spent = b.atoms.map(() => 0);     // electrons each atom has put into bonds

  for (const [i, k] of b.bonds) {
    const order = bondOrder(b.atoms[i].el, b.atoms[k].el);
    spent[i] += order; spent[k] += order;
    const count = order * 2;              // a bond is pairs: 2 electrons per order
    for (let q = 0; q < count; q++) {
      const e = makeElectron('bond', q % 2 ? b.atoms[k].el : b.atoms[i].el);
      e.i = i; e.k = k;
      // Spread the pair (or the four of a double bond) around the figure-8 so
      // they are not stacked on top of one another.
      const t = q / count;
      e.visit = t < 0.5 ? 0 : 1;
      e.phase = (t % 0.5) * 2 * Math.PI;
      list.push(e);
    }
  }

  for (let i = 0; i < b.atoms.length; i++) {
    const at = b.atoms[i];
    const lone = Math.max(0, (VALENCE[at.el] || 0) - spent[i]);
    // Point the lone electrons away from whatever this atom is bonded to
    let awayX = 0, awayY = 0;
    for (const [p, q] of b.bonds) {
      const other = p === i ? q : q === i ? p : -1;
      if (other < 0) continue;
      awayX += at.lx - b.atoms[other].lx;
      awayY += at.ly - b.atoms[other].ly;
    }
    // Start angle only — which way the atom faces no longer confines anything,
    // it just stops every atom's ring starting from the same place.
    const facing = (awayX !== 0 || awayY !== 0) ? Math.atan2(awayY, awayX) : 0;
    for (let q = 0; q < lone; q++) {
      const e = makeElectron('lone', at.el);
      e.i = i;
      e.angle = facing + q / lone * Math.PI * 2;   // evenly spaced round the circle
      e.x = at.lx + valenceRadius(at.el) * Math.cos(e.angle);
      e.y = at.ly + valenceRadius(at.el) * Math.sin(e.angle);
      list.push(e);
    }
  }
  b.electrons = list;
}

// Non-bonding electrons just run a circle at a fixed radius — no jitter, no
// damping, no sector. Evenly spaced and all going the same way round, so an
// atom's lone electrons read as one ring at one radius rather than a scribble.
//
// They do pass through the bond region on the way round, which a real lone pair
// would not; the plain circle is the point here, not the lobe geometry.
let loneRadius = 1.0;     // multiple of the atom's valence radius
let loneSpeed  = 0.125;   // radians per frame at 60 fps

// Ideal lemniscate position for a bond electron, in body-local coordinates.
// `a = r + d` puts the far edge of each lobe exactly on that atom's valence
// shell: d carries it to the nucleus, r wraps it around.
//
// The two visits are the two lobes of ONE figure-8 — visit 0 is t in [0, pi],
// visit 1 is t in [pi, 2pi] — so the electron crosses the bond midpoint between
// them, which is the point of the whole shape.
function lemniscate(e, b, phase, visit) {
  const ai = b.atoms[e.i], ak = b.atoms[e.k];
  const mx = (ai.lx + ak.lx) / 2, my = (ai.ly + ak.ly) / 2;
  const bx = ak.lx - ai.lx, by = ak.ly - ai.ly;
  const sep = Math.hypot(bx, by) || 1;
  const ux = bx / sep, uy = by / sep;
  const d = sep / 2;
  const r = valenceRadius(visit === 0 ? ai.el : ak.el);
  const a = r * (1 + e.effR) + d;

  const t = visit === 0 ? phase + Math.PI : phase;
  const denom = 1 + Math.cos(t) ** 2;
  const lx = a * Math.sin(t) / denom;
  const ly = eWidth * (1 + e.effW) * a * Math.sin(t) * Math.cos(t) / denom;
  // swing the whole lobe off the bond axis, about the crossing point
  const ct = Math.cos(e.effT), st = Math.sin(e.effT);
  const px = lx * ct - ly * st, py = lx * st + ly * ct;
  // rotate from bond axis into body-local
  return { x: mx + px * ux - py * uy, y: my + px * uy + py * ux, a, d };
}

function stepBondElectron(e, b, k) {
  if (e.visit !== e.prevVisit) {          // new lobe: re-roll all three wobbles
    e.prevVisit = e.visit;
    e.targetR = (Math.random() * 2 - 1) * eRadial;
    e.targetW = (Math.random() * 2 - 1) * eWander;
    e.targetT = (Math.random() * 2 - 1) * eTilt;
  }
  e.effR += (e.targetR - e.effR) * eRoll;
  e.effW += (e.targetW - e.effW) * eRoll;
  e.effT += (e.targetT - e.effT) * eRoll;

  const p0 = lemniscate(e, b, e.phase, e.visit);
  // Normalise by d/a so the speed at the crossing is the same on both sides.
  // Without this a bond between a big atom and a small one kinks at the
  // midpoint, because the two lobes have different amplitudes.
  let spd = eSpeed * k * (p0.d / p0.a);
  const localT = e.visit === 0 ? e.phase + Math.PI : e.phase;
  spd *= eCrossSlow + (1 - eCrossSlow) * Math.abs(Math.sin(localT));

  let nextPhase = e.phase + spd, nextVisit = e.visit;
  if (nextPhase >= Math.PI) { nextPhase -= Math.PI; nextVisit = (e.visit + 1) % 2; }
  const p1 = lemniscate(e, b, nextPhase, nextVisit);
  e.phase = nextPhase; e.visit = nextVisit;

  // Steer towards the ideal velocity rather than snapping to the ideal point —
  // that slight lag is what keeps the trail from being a perfect repeated curve.
  const sr = e.n === 0 ? 1 : eSteer;
  e.vx += sr * ((p1.x - p0.x) - e.vx);
  e.vy += sr * ((p1.y - p0.y) - e.vy);
  e.x += e.vx + 0.06 * (p0.x - e.x);
  e.y += e.vy + 0.06 * (p0.y - e.y);
}

// Straight round the circle, same speed every frame. The radius is read fresh
// each step so the dev slider moves the ring live.
function stepLoneElectron(e, b, k) {
  const at = b.atoms[e.i];
  const r = valenceRadius(at.el) * loneRadius;
  e.angle += loneSpeed * k;
  e.x = at.lx + r * Math.cos(e.angle);
  e.y = at.ly + r * Math.sin(e.angle);
}

// One step per FRAME, not per physics sub-step: the phase logic is tuned in
// per-frame units and breaks up with a large or uneven step.
function stepElectrons(frameDt) {
  const k = Math.min(2, frameDt * 60);        // 1.0 at 60 fps, clamped
  const len = Math.round((TIER_TRAIL_LEN[_quality] || 32) * eTrailScale);
  for (const b of world.bodies) {
    if (!b.electrons) continue;
    for (const e of b.electrons) {
      if (e.kind === 'bond') stepBondElectron(e, b, k);
      else if (showLonePairs) stepLoneElectron(e, b, k);
      else continue;
      e.tx[e.head] = e.x; e.ty[e.head] = e.y;
      e.head = (e.head + 1) % TRAIL_MAX;
      if (e.n < Math.min(len, TRAIL_MAX)) e.n++;
      else if (e.n > len) e.n = len;
    }
  }
}

// ─── Drawing the trails ───────────────────────────────────────────────────────
// Bucketed alpha, as in bonds: the trail is split into BUCKETS runs and each is
// stroked once at its own alpha, instead of one stroke per point. That is the
// difference between ~10 strokes an electron and ~50.
function drawElectrons(b, dc = ctx) {
  if (!b.electrons) return;
  const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  const BUCKETS = TIER_BUCKETS[_quality] || 6;

  dc.save();
  dc.lineCap = 'round';
  dc.lineJoin = 'round';

  for (const e of b.electrons) {
    if (e.kind === 'lone' && !showLonePairs) continue;
    const n = e.n;
    if (n < 2) continue;
    const rgb = ELEMENTS[e.el].rgb;
    // ring buffer -> world
    const idx = (i) => (e.head - n + i + TRAIL_MAX * 2) % TRAIL_MAX;
    const wx = (i) => { const j = idx(i); return b.x + e.tx[j] * ca - e.ty[j] * sa; };
    const wy = (i) => { const j = idx(i); return b.y + e.tx[j] * sa + e.ty[j] * ca; };

    dc.lineWidth = 1.8;
    dc.strokeStyle = rgba(rgb, 1);
    for (let q = 0; q < BUCKETS; q++) {
      const i0 = Math.round(q / BUCKETS * (n - 1));
      const i1 = Math.round((q + 1) / BUCKETS * (n - 1));
      if (i1 <= i0) continue;
      dc.globalAlpha = ((q + 1) / BUCKETS) ** 2 * 0.85;
      dc.beginPath();
      dc.moveTo(wx(i0), wy(i0));
      // midpoint quadratics smooth the polyline without extra sample points
      if (i1 > i0 + 1) {
        dc.lineTo((wx(i0) + wx(i0 + 1)) / 2, (wy(i0) + wy(i0 + 1)) / 2);
        for (let i = i0 + 1; i < i1; i++)
          dc.quadraticCurveTo(wx(i), wy(i), (wx(i) + wx(i + 1)) / 2, (wy(i) + wy(i + 1)) / 2);
      }
      dc.lineTo(wx(i1), wy(i1));
      dc.stroke();
    }

    // The arrowhead IS the electron. No dot — the arrow says which way it goes.
    const hx = wx(n - 1), hy = wy(n - 1);
    const dx = hx - wx(n - 2), dy = hy - wy(n - 2);
    const dl = Math.hypot(dx, dy);
    if (dl > 1e-4) {
      const nx = dx / dl, ny = dy / dl;
      const AL = 7, AW = 3.2;
      dc.globalAlpha = 1;
      if (_quality === 'hi-res') {
        const sp = glowSprite(rgb, 9);
        dc.drawImage(sp, hx - sp.width / 2, hy - sp.height / 2);
      }
      dc.fillStyle = rgba(rgb, 1);
      dc.beginPath();
      dc.moveTo(hx + nx * AL, hy + ny * AL);
      dc.lineTo(hx - ny * AW, hy + nx * AW);
      dc.lineTo(hx + ny * AW, hy - nx * AW);
      dc.closePath();
      dc.fill();
    }
  }
  dc.restore();
}

// ─── Species ──────────────────────────────────────────────────────────────────
// What the world can be populated with. `composition` says how many of each to
// spawn — both dials live in the dev panel.
const SPECIES = {
  H2: { els: ['H', 'H'] },
  O2: { els: ['O', 'O'] },
  He: { els: ['He'] },        // monatomic: no bond, two lone electrons
};
const COMPOSITION_DEFAULT = { H2: 4, O2: 2, He: 0 };   // 2:1 — the ratio for water
const COMPOSITION_MAX = 6;
const composition = { ...COMPOSITION_DEFAULT };

// ── Action log (for bug reports) ─────────────────────────────────────────────
const actionLog = [];
function logAction(msg) {
  actionLog.push(msg);
  if (actionLog.length > 25) actionLog.shift();
}

// Piecewise zoom mapping: slider -1..0..1, default at centre (v=0)
// v=-1 → 0.83 (20% wider),  v=0 → 1.0,  v=1 → 2.0
function zoomFromSlider(v) {
  return v <= 0 ? 1.0 + v * 0.17 : 1.0 + v * 1.0;
}

// ─── World ────────────────────────────────────────────────────────────────────
// A walled box filling the canvas between the toolbar and the energy bar.
// Molecules are rigid bodies: they translate, spin, and bounce elastically off
// one another and off the four walls.
//
// (This was a wrap-around "asteroids" box until walls replaced it. The wrap
// helpers it needed — wrapDelta for minimum-image collisions, wrapOffsets for
// drawing a body on both sides of an edge — are gone; git has them.)
let viewZoom = 1.0;
let showAtoms = true;
let running = false;

// Atomic masses, in units where H = 1. Used for collision impulses and for the
// kinetic-energy readout, so a bounce off an O2 behaves like a bounce off
// something 16× heavier per atom.
const ATOMIC_MASS = { H: 1, O: 16, He: 4 };

const world = {
  w: 0, h: 0,          // wrap dimensions
  top: 0,              // canvas y of the world's top edge
  bodies: [],
  time: 0,             // seconds of simulated time since the last respawn
};

// The world fills the band of canvas between the toolbar and the energy bar, so
// nothing can drift behind an opaque panel and look like it vanished.
function syncWorldBox() {
  const tbH  = document.getElementById('toolbar').offsetHeight;
  const sbEl = document.getElementById('energyBar');
  const sbH  = sbEl.classList.contains('visible') ? sbEl.offsetHeight : 0;
  const oldW = world.w, oldH = world.h;
  world.top = tbH;
  world.w   = canvas.width;
  world.h   = Math.max(120, canvas.height - tbH - sbH);
  return { oldW, oldH };
}

let nextBodyId = 0;

// Build a rigid body from a list of element symbols. Atom positions are stored
// once in body-local coordinates; world positions are derived each frame from
// (x, y, angle), so the molecule can never stretch or come apart.
function makeBody(els, x, y, heading, speed, spin, nominal = speed) {
  const offs = [0];
  for (let k = 1; k < els.length; k++) offs.push(offs[k - 1] + bondLen(els[k - 1], els[k]));
  const mid = (offs[0] + offs[offs.length - 1]) / 2;

  const atoms = els.map((el, k) => ({
    el,
    lx: offs[k] - mid,            // body-local, along the molecule axis
    ly: 0,
    r: ATOM_RADIUS * ELEMENTS[el].rScale,
    m: ATOMIC_MASS[el] || 1,
  }));

  const mass = atoms.reduce((a, at) => a + at.m, 0);
  // Moment of inertia about the centre of mass, treating atoms as point masses
  const inertia = atoms.reduce((a, at) => a + at.m * (at.lx * at.lx + at.ly * at.ly), 0) || 1;

  return {
    id: nextBodyId++,
    els, atoms, mass, inertia,
    // Which atoms are bonded to which, as index pairs. Atoms are laid out in a
    // row, so each one bonds to the previous: a diatomic has the single bond
    // [[0,1]]. Water would be [[0,1],[1,2]] — two lobes off the oxygen.
    bonds: els.slice(1).map((_, k) => [k, k + 1]),
    flare: 0,                // collision brightness, decays towards 0
    vTarget: nominal,        // nominal speed for this species, tracks temp + dial
    x, y,
    vx: Math.cos(heading) * speed,
    vy: Math.sin(heading) * speed,
    angle: Math.random() * Math.PI * 2,
    spin,                                              // radians per second
    radius: Math.max(...atoms.map(at => Math.hypot(at.lx, at.ly) + at.r)),
    electrons: null,        // filled by buildElectrons just below
  };
}

// World positions of a body's atoms, optionally offset (used to draw wrapped copies)
// makeBody returns before the bonds list exists on the object it is building,
// so the valence shell is attached here, once the body is complete.
function withElectrons(b) { buildElectrons(b); return b; }

function bodyAtoms(b, dx = 0, dy = 0) {
  const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  return b.atoms.map((at, i) => ({
    x: b.x + at.lx * ca - at.ly * sa + dx,
    y: b.y + at.lx * sa + at.ly * ca + dy,
    z: 0, el: at.el, i, bodyId: b.id,
  }));
}

// Launch speed in px/s for H2, from the speed slider (0.2–8.0 on the dial)
function launchSpeed() {
  return parseFloat(document.getElementById('speedDial').value) * 45;
}

// Equipartition: heavier molecules start slower, so every species begins with
// the same kinetic energy — the way a real gas mixture at one temperature does.
// An O2 is 16× the mass of an H2, so it sets off at a quarter the speed.
// Off, every species starts at the dial speed regardless of mass. Dev toggle.
let equipartition = true;
const H2_MASS = 2 * ATOMIC_MASS.H;

function speciesSpeed(els) {
  const base = launchSpeed() * tempCurrent;
  if (!equipartition) return base;
  const m = els.reduce((a, el) => a + (ATOMIC_MASS[el] || 1), 0);
  return base * Math.sqrt(H2_MASS / m);
}

// ─── Temperature ──────────────────────────────────────────────────────────────
// A two-state dial on the main toolbar. Switching it does not teleport the world
// to a new speed — `tempCurrent` chases `tempTarget` over about a second, and
// every molecule is rescaled by the per-frame ratio, so you watch the whole
// world accelerate. 3× the speed is 9× the kinetic energy, which the energy
// graph shows honestly.
const TEMP_HIGH = 3;        // High runs at 3× Low
const TEMP_TAU  = 0.26;     // seconds — exponential approach, quick then settling
let tempLevel   = 'low';
let tempTarget  = 1;
let tempCurrent = 1;

function setTemperature(level) {
  tempLevel  = level;
  tempTarget = level === 'high' ? TEMP_HIGH : 1;
  document.querySelectorAll('.temp-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.temp === level));
  logAction('Temperature: ' + level);
}

// Called once per frame with WALL-clock dt, so the ramp takes the same time on
// screen no matter where the playback-speed slider is.
function stepTemperature(rawDt) {
  if (Math.abs(tempTarget - tempCurrent) < 1e-4) { tempCurrent = tempTarget; return; }
  const next = tempCurrent + (tempTarget - tempCurrent) * (1 - Math.exp(-rawDt / TEMP_TAU));
  const k = next / tempCurrent;
  for (const b of world.bodies) { b.vx *= k; b.vy *= k; b.spin *= k; b.vTarget *= k; }
  tempCurrent = next;
}

// ─── Spawn speed spread ───────────────────────────────────────────────────────
// Speeds are spread around the target with a bell shape rather than a flat
// range: a standard normal resampled until it lands inside ±1σ, so the fastest
// and slowest molecules sit exactly one standard deviation from the peak.
// Rejection, not clamping — clamping would pile molecules onto the two end
// values and put bumps where the distribution should be thinnest.
//
// n is small enough that "Gaussian" is an intent rather than a measurable fact;
// the point is that middling speeds are common and extremes are rare.
const SPEED_SIGMA = 0.25;   // 1σ as a fraction of the mean
const SPIN_SIGMA  = 0.25;

function gaussianUnit() {
  // Box–Muller
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// A standard normal truncated to ±1: the bell between the two bounds.
function truncNormal() {
  let z;
  do { z = gaussianUnit(); } while (z < -1 || z > 1);
  return z;
}

function spreadSpeed(mean) {
  return mean * (1 + truncNormal() * SPEED_SIGMA);
}

function spawnWorld() {
  syncWorldBox();
  world.bodies = [];
  world.time = 0;

  // Interleave the species so a crowded world does not end up with all the H2
  // crammed into whatever space the O2 left over.
  const queue = [];
  for (const [key, n] of Object.entries(composition)) {
    for (let i = 0; i < n; i++) queue.push(SPECIES[key].els);
  }
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }

  for (const els of queue) {
    const speed = speciesSpeed(els);
    let placed = null;
    // Try for a spot clear of everything already down; after enough tries take
    // what we can get rather than loop forever in a crowded world.
    for (let attempt = 0; attempt < 400; attempt++) {
      const b = withElectrons(makeBody(els, 0, 0,
        Math.random() * Math.PI * 2,
        spreadSpeed(speed),
        truncNormal() * SPIN_SIGMA * 4.8,    // same bell, signed — spin either way
        speed));
      // Placed clear of the walls, so nothing starts the run already embedded
      // in one and gets shoved out on the first step.
      b.x = b.radius + Math.random() * Math.max(1, world.w - 2 * b.radius);
      b.y = b.radius + Math.random() * Math.max(1, world.h - 2 * b.radius);
      const clear = world.bodies.every(o =>
        Math.hypot(o.x - b.x, o.y - b.y) > (o.radius + b.radius) * 1.35);
      placed = b;
      if (clear) break;
    }
    world.bodies.push(placed);
  }
  spinCapHits = 0; floorTopUps = 0; energyCreated = 0;
  lastDialSpeed = launchSpeed() * tempCurrent;
  resetEnergyTrace();
  updateSpeciesCounters();
}

// ─── Physics ──────────────────────────────────────────────────────────────────
const RESTITUTION = 1.0;   // 1 = perfectly elastic: total kinetic energy is conserved

function stepWorld(dt) {
  // Move, spin, wrap
  for (const b of world.bodies) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.angle += b.spin * dt;
    collideWalls(b);
    if (b.flare > 1e-4) b.flare *= Math.exp(-dt / FLARE_TAU); else b.flare = 0;
  }
  world.time += dt;

  // Collisions, atom against atom
  for (let i = 0; i < world.bodies.length; i++) {
    for (let j = i + 1; j < world.bodies.length; j++) {
      collidePair(world.bodies[i], world.bodies[j]);
    }
  }
}

// Velocity of a point on a rigid body, including its spin.
// In 2D the cross product ω × r is (-ω·ry, ω·rx).
function pointVel(b, rx, ry) {
  return [b.vx - b.spin * ry, b.vy + b.spin * rx];
}

// ─── Speed band ───────────────────────────────────────────────────────────────
// Deliberately not pure physics. A molecule leaving a collision is held inside
// the same ±SPEED_SIGMA band the spawn uses, so nothing ends up crawling across
// the screen or streaking off it.
//
// The energy that takes is not discarded — it moves between translation and
// rotation. Too fast and the surplus is spun up; too slow and the shortfall is
// paid for out of the spin. Rotation is the reservoir that lets the band be
// enforced while the body's total kinetic energy stays exactly what the
// collision gave it. Only when the spin would exceed MAX_SPIN, or when there is
// not enough spin to buy the speed-up, does any energy actually change.
let speedBandOn = true;        // dev toggle
let MAX_SPIN    = 14;          // rad/s — past this it is a blur, not a spin
let spinCapHits = 0;    // diagnostics: times the reservoir could not take it
let floorTopUps = 0;
let energyCreated = 0;   // energy conjured to hold the floor

// Settled across the colliding pair, not one body at a time. A slow molecule
// usually has little spin of its own to spend, but the molecule it just hit is
// normally the fast one — so the pair is the natural place to balance the books.
//
// The pair's total energy is measured first, translation is pulled into band,
// and whatever is left over is what the two spins are set to carry. That
// conserves the pair's energy exactly by construction; the only leaks are the
// spin cap and the case where the floor costs more than the pair has.
// Soft knee. A hard clamp parks every out-of-range molecule on the boundary —
// measured, 40% of the population ended up at exactly the floor speed, which is
// the same pile-up the spawn sampler goes out of its way to avoid.
//
// Instead the outer KNEE fraction of each half-band is compressed: speeds below
// it pass through untouched, speeds above it approach the limit asymptotically
// and never reach it. Continuous at the knee, monotonic, strictly bounded.
const KNEE = 0.35;

function softBand(v, vMin, vMax) {
  const d = (vMax - vMin) / 2 * KNEE;
  if (d <= 0) return v;
  if (v > vMax - d) return vMax - d * Math.exp(-(v - (vMax - d)) / d);
  if (v < vMin + d) return vMin + d * Math.exp(-((vMin + d) - v) / d);
  return v;
}

// A wall is not a partner that can take the surplus, so a bounce is settled
// against the body's own spin. That is less room than settlePairSpeeds has, and
// when there is not enough the shortfall is counted in the same two totals.
function settleBodySpeed(b) {
  if (!speedBandOn) return;
  const v = Math.hypot(b.vx, b.vy);
  if (v < 1e-9) return;
  const target = softBand(v, b.vTarget * (1 - SPEED_SIGMA), b.vTarget * (1 + SPEED_SIGMA));
  if (target === v) return;

  const E0 = 0.5 * b.mass * v * v + 0.5 * b.inertia * b.spin * b.spin;
  const k = target / v;
  b.vx *= k; b.vy *= k;
  const rotBudget = E0 - 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy);

  if (rotBudget < 0) {                      // floor costs more than the body owns
    b.spin = 0;
    energyCreated += -rotBudget;
    floorTopUps++;
    return;
  }
  let e = rotBudget;
  const cap = 0.5 * b.inertia * MAX_SPIN * MAX_SPIN;
  if (e > cap) { e = cap; spinCapHits++; }
  const dir = b.spin !== 0 ? Math.sign(b.spin) : (Math.random() < 0.5 ? -1 : 1);
  b.spin = dir * Math.sqrt(2 * e / b.inertia);
}

function settlePairSpeeds(A, B) {
  if (!speedBandOn) return;
  const pair = [A, B];
  const E0 = pair.reduce((a, b) =>
    a + 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy)
      + 0.5 * b.inertia * b.spin * b.spin, 0);

  // 1. Pull each body's speed into its own band
  let changed = false;
  for (const b of pair) {
    const v = Math.hypot(b.vx, b.vy);
    if (v < 1e-9) continue;
    const target = softBand(v, b.vTarget * (1 - SPEED_SIGMA), b.vTarget * (1 + SPEED_SIGMA));
    if (target === v) continue;
    const k = target / v;
    b.vx *= k; b.vy *= k;
    changed = true;
  }
  if (!changed) return;

  // 2. Everything the pair has that translation is not using belongs to spin
  const trans = pair.reduce((a, b) => a + 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy), 0);
  const rotBudget = E0 - trans;

  if (rotBudget < 0) {
    // The floor costs more than the pair owns — both are slow and neither has
    // spin left to sell. The band wins anyway: the speeds stand and the pair
    // gains the shortfall out of nowhere. This is the one place the sim creates
    // energy, it is counted, and `energySplit()` reports it.
    for (const b of pair) b.spin = 0;
    energyCreated += -rotBudget;
    floorTopUps++;
    return;
  }

  // 3. Hand the budget to the two spins, keeping their ratio and directions so
  //    the character of the collision survives being rebalanced.
  const rotNow = pair.map(b => 0.5 * b.inertia * b.spin * b.spin);
  const rotSum = rotNow[0] + rotNow[1];
  pair.forEach((b, i) => {
    let e = rotBudget * (rotSum > 1e-12 ? rotNow[i] / rotSum : 0.5);
    const cap = 0.5 * b.inertia * MAX_SPIN * MAX_SPIN;
    if (e > cap) { e = cap; spinCapHits++; }   // the one place energy leaves
    const dir = b.spin !== 0 ? Math.sign(b.spin) : (Math.random() < 0.5 ? -1 : 1);
    b.spin = dir * Math.sqrt(2 * e / b.inertia);
  });
}

// ─── Walls ────────────────────────────────────────────────────────────────────
// Perfectly elastic: a molecule leaves with exactly the energy it arrived with.
//
// The contact is at the ATOM that reaches the wall, not at the molecule's
// centre, so the same rigid-body impulse runs as for a molecule-molecule hit and
// a corner-on bounce sets the molecule spinning. Hitting a wall square on, with
// the bond axis along the normal, produces no spin at all — same as a head-on
// collision, and for the same reason: no torque arm.
const WALL_RESTITUTION = 1.0;

function wallImpulse(b, rx, ry, nx, ny, depth) {
  const [vx, vy] = pointVel(b, rx, ry);
  const vn = vx * nx + vy * ny;
  if (vn < 0) {                             // moving into the wall, not already leaving
    const rn = rx * ny - ry * nx;
    const invMassSum = 1 / b.mass + rn * rn / b.inertia;
    const jImp = -(1 + WALL_RESTITUTION) * vn / invMassSum;
    b.vx += jImp * nx / b.mass;
    b.vy += jImp * ny / b.mass;
    b.spin += rn * jImp / b.inertia;
    b.flare = Math.min(1, b.flare + jImp / (b.mass * Math.max(1, b.vTarget)));
    settleBodySpeed(b);
  }
  b.x += nx * depth;                        // lift clear so it cannot stick
  b.y += ny * depth;
}

// Each atom is tested against all four walls. b.x moves as contacts resolve, so
// the atom's world position is recomputed for every one of them — a molecule in
// a corner is touching two walls at once.
function collideWalls(b) {
  const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  for (const at of b.atoms) {
    const rx = at.lx * ca - at.ly * sa, ry = at.lx * sa + at.ly * ca;
    let d;
    if ((d = at.r - (b.x + rx))           > 0) wallImpulse(b, rx, ry,  1,  0, d);
    if ((d = (b.x + rx) + at.r - world.w) > 0) wallImpulse(b, rx, ry, -1,  0, d);
    if ((d = at.r - (b.y + ry))           > 0) wallImpulse(b, rx, ry,  0,  1, d);
    if ((d = (b.y + ry) + at.r - world.h) > 0) wallImpulse(b, rx, ry,  0, -1, d);
  }
}

function collidePair(A, B) {
  const cdx = B.x - A.x, cdy = B.y - A.y;
  if (Math.hypot(cdx, cdy) > A.radius + B.radius) return;   // broad phase

  const ca = Math.cos(A.angle), sa = Math.sin(A.angle);
  const cb = Math.cos(B.angle), sb = Math.sin(B.angle);

  for (const pa of A.atoms) {
    // Atom offsets from each body's centre, in world axes
    const rax = pa.lx * ca - pa.ly * sa, ray = pa.lx * sa + pa.ly * ca;
    for (const pb of B.atoms) {
      const rbx = pb.lx * cb - pb.ly * sb, rby = pb.lx * sb + pb.ly * cb;

      // Vector from atom a to atom b, across the wrap
      const dx = cdx + rbx - rax, dy = cdy + rby - ray;
      const dist = Math.hypot(dx, dy);
      const minDist = pa.r + pb.r;
      if (dist >= minDist || dist === 0) continue;

      const nx = dx / dist, ny = dy / dist;   // contact normal, A → B

      const [vax, vay] = pointVel(A, rax, ray);
      const [vbx, vby] = pointVel(B, rbx, rby);
      const vn = (vbx - vax) * nx + (vby - vay) * ny;
      if (vn > 0) continue;                   // already separating

      // Rigid-body impulse: the rotational terms are what make a glancing hit
      // set the molecule spinning instead of just shoving it sideways.
      const rnA = rax * ny - ray * nx;
      const rnB = rbx * ny - rby * nx;
      const invMassSum = 1 / A.mass + 1 / B.mass
                       + rnA * rnA / A.inertia + rnB * rnB / B.inertia;
      const jImp = -(1 + RESTITUTION) * vn / invMassSum;

      A.vx -= jImp * nx / A.mass;  A.vy -= jImp * ny / A.mass;
      B.vx += jImp * nx / B.mass;  B.vy += jImp * ny / B.mass;
      A.spin -= rnA * jImp / A.inertia;
      B.spin += rnB * jImp / B.inertia;

      // Light the bond up for a moment. jImp / (mass x nominal speed) is near 1
      // for a square hit at the speed this species normally travels, so a hard
      // collision flares and a graze barely registers.
      A.flare = Math.min(1, A.flare + jImp / (A.mass * Math.max(1, A.vTarget)));
      B.flare = Math.min(1, B.flare + jImp / (B.mass * Math.max(1, B.vTarget)));

      // Push the pair apart so they do not stay interlocked and re-collide
      const overlap = minDist - dist;
      const push = overlap / (1 / A.mass + 1 / B.mass) * 0.8;
      A.x -= push * nx / A.mass;  A.y -= push * ny / A.mass;
      B.x += push * nx / B.mass;  B.y += push * ny / B.mass;

      settlePairSpeeds(A, B);
      return;   // one contact per pair per frame keeps the response stable
    }
  }
}

function energyOfMotion() {
  return world.bodies.reduce((a, b) =>
    a + 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy)
      + 0.5 * b.inertia * b.spin * b.spin, 0);
}

// ─── Formula readout ──────────────────────────────────────────────────────────
const SUBS = '\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089';
const sub = (n) => String(n).split('').map(d => SUBS[+d]).join('');

// ['H','H'] -> 'H₂';  ['H','O','H'] -> 'H₂O'.  Carbon first, then hydrogen, then
// the rest alphabetically — the usual Hill ordering for a formula.
function formulaOf(els) {
  const count = {};
  for (const e of els) count[e] = (count[e] || 0) + 1;
  const rank = (e) => e === 'C' ? 0 : e === 'H' ? 1 : 2;
  return Object.keys(count)
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(e => e + (count[e] > 1 ? sub(count[e]) : ''))
    .join('');
}

// Shows what is in the world: the distinct species and how many of each. Two
// fixed slots, each a "xN" count beside a formula. Slot 1 always holds its
// space (a dash in an empty world) and slot 2 goes visibility:hidden rather
// than display:none when there is only one species, so the pink box never
// changes width.
function updateSpeciesCounters() {
  const slots = [
    { count: document.getElementById('sp1Count'), formula: document.getElementById('sp1Formula') },
    { count: document.getElementById('sp2Count'), formula: document.getElementById('sp2Formula'),
      box:   document.getElementById('sp2Slot') },
  ];
  if (!slots[0].formula) return;

  const tally = new Map();
  for (const b of world.bodies) {
    const f = formulaOf(b.els);
    tally.set(f, (tally.get(f) || 0) + 1);
  }
  const rows = [...tally.entries()];

  slots.forEach((slot, k) => {
    const [formula, n] = rows[k] || [];
    slot.count.textContent   = formula ? '×' + n + ' ' : '';
    slot.formula.textContent = formula || '—';
    if (slot.box) slot.box.style.visibility = formula ? '' : 'hidden';
  });
}

// ─── Speed lines — the dash marks beside the launch-speed dial ──────────────
function drawSpeedLines() {
  const canvas = document.getElementById('speedLinesCanvas');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const slider = document.getElementById('speedDial');
  const min = parseFloat(slider.min), max = parseFloat(slider.max);
  const t   = (parseFloat(slider.value) - min) / (max - min);  // 0..1

  c.clearRect(0, 0, w, h);

  // 3 right-aligned horizontal lines; lengths scale with slider
  const maxLen  = w - 2;
  const scales  = [0.65, 1.0, 0.80];
  const ys      = [h * 0.25, h * 0.5, h * 0.75];

  scales.forEach((scale, i) => {
    const tFloor = 0.18 + 0.82 * t;  // minimum ~18% even at slider min
    const len = tFloor * maxLen * scale;
    const x = w - len;
    const y = Math.round(ys[i]);

    // outer glow
    c.save();
    c.strokeStyle = 'rgba(180,180,210,0.25)';
    c.lineWidth = 4;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();

    // core
    c.strokeStyle = 'rgba(210,210,230,0.85)';
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
    c.restore();
  });
}

// ─── Molecule icons (NEW button, speed dial, Atoms mode button) ─────────────
// Same hollow-shell look as drawAtom, at icon scale and independent of the
// quality setting (these canvases are tiny and redraw at ~15 fps).
function drawAtomIcon(c, px, py, el, R) {
  const e = ELEMENTS[el];
  const r = R * e.rScale;
  // A plain ring with a faint wash — the scene's travelling arrow is unreadable
  // at icon size, so the icons just carry the element's colour and relative size.
  c.fillStyle = rgba(e.rgb, 0.10);
  c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = rgba(e.rgb, 0.95);
  c.lineWidth   = Math.max(1, r * 0.14);
  c.beginPath(); c.arc(px, py, r * 0.95, 0, Math.PI * 2); c.stroke();
}

// Atom offsets along the molecule axis in units of one H radius, re-centred,
// plus the half-extents needed to fit it to a canvas.
function moleculeIconLayout(els) {
  const offs = [0];
  for (let k = 1; k < els.length; k++) {
    offs.push(offs[k - 1] + (ELEMENTS[els[k - 1]].rScale + ELEMENTS[els[k]].rScale) * BOND_OVERLAP);
  }
  const mid = (offs[0] + offs[offs.length - 1]) / 2;
  const rel = offs.map(o => o - mid);
  return {
    rel,
    halfW: Math.max(...els.map((e, k) => Math.abs(rel[k]) + ELEMENTS[e].rScale)),
    halfH: Math.max(...els.map(e => ELEMENTS[e].rScale)),
  };
}

// Draws `els` as a molecule centred in `canvas`, scaled to fit. `jitter` is an
// optional shared {x, y} wobble so the icon looks alive.
function drawMoleculeIcon(canvas, els, jitter = null, pad = 3) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  c.clearRect(0, 0, w, h);
  const { rel, halfW, halfH } = moleculeIconLayout(els);
  const R  = Math.min((w / 2 - pad) / halfW, (h / 2 - pad) / halfH);
  const cx = w / 2 + (jitter ? jitter.x : 0);
  const cy = h / 2 + (jitter ? jitter.y : 0);
  // Back-to-front is irrelevant for a flat row, but draw left-to-right for stable overlap
  els.forEach((el, k) => drawAtomIcon(c, cx + rel[k] * R, cy, el, R));
}

function drawOutlineIcon() {
  const ic = document.getElementById('outlineModeIcon');
  if (!ic) return;
  const c = ic.getContext('2d');
  const w = ic.width, h = ic.height;
  const cx = w / 2, cy = h / 2;
  const sR = Math.min(w, h) * 0.36;
  const R  = 2.5;
  const N  = Math.max(5, Math.round(2 * Math.PI * sR / (R * 1.5)));
  const centers = Array.from({ length: N }, (_, k) => {
    const a = k * 2 * Math.PI / N;
    return { x: cx + sR * Math.cos(a), y: cy + sR * Math.sin(a) };
  });
  // outerIntersection equivalent for the icon ctx
  function iconOuterIntersect(c1, c2) {
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const d  = Math.sqrt(dx * dx + dy * dy);
    const h2 = Math.sqrt(Math.max(0, R * R - (d / 2) ** 2));
    const mx = (c1.x + c2.x) / 2, my = (c1.y + c2.y) / 2;
    const px = -dy / d * h2, py = dx / d * h2;
    const p1 = { x: mx + px, y: my + py }, p2 = { x: mx - px, y: my - py };
    const d1 = (p1.x - cx)**2 + (p1.y - cy)**2;
    const d2 = (p2.x - cx)**2 + (p2.y - cy)**2;
    return d1 > d2 ? p1 : p2;
  }
  const arcs = centers.map((pt, k) => {
    const prev = centers[(k - 1 + N) % N], next = centers[(k + 1) % N];
    const sp = iconOuterIntersect(pt, prev);
    const ep = iconOuterIntersect(pt, next);
    return { cx: pt.x, cy: pt.y, startAngle: Math.atan2(sp.y - pt.y, sp.x - pt.x), endAngle: Math.atan2(ep.y - pt.y, ep.x - pt.x) };
  });
  c.clearRect(0, 0, w, h);
  c.save();
  c.shadowColor = 'rgba(80,160,255,0.9)'; c.shadowBlur = 4;
  c.strokeStyle = 'rgba(160,215,255,1)'; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(arcs[0].cx + R * Math.cos(arcs[0].startAngle), arcs[0].cy + R * Math.sin(arcs[0].startAngle));
  for (const arc of arcs) c.arc(arc.cx, arc.cy, R, arc.startAngle, arc.endAngle, false);
  c.closePath(); c.stroke(); c.restore();
}

// One loop for every live toolbar icon, at ~15 fps. Each gets its own wobble so
// they do not all drift in lockstep. (The speed dial used to run a second rAF
// loop of its own at the full frame rate, for an icon 46 px across.)
const ICON_CANVASES = [
  { id: 'newBtnMolecule',      pad: 4, wobble: 0.7, jitter: { x: 0, y: 0 } },   // respawn button
  { id: 'speedDialIconCanvas', pad: 3, wobble: 0.7, jitter: { x: 0, y: 0 } },   // beside the speed dial
  { id: 'atomsModeIcon',       pad: 1, wobble: 0.4, jitter: { x: 0, y: 0 } },   // Atoms view button
];

let _iconLast = -67;
function toolbarIconLoop(now) {
  if (now - _iconLast >= 67) {   // ~15 fps
    _iconLast = now;
    for (const ic of ICON_CANVASES) {
      ic.jitter.x = (ic.jitter.x + (Math.random() - 0.5) * ic.wobble) * 0.78;
      ic.jitter.y = (ic.jitter.y + (Math.random() - 0.5) * ic.wobble) * 0.78;
      drawMoleculeIcon(document.getElementById(ic.id), SPECIES.H2.els, ic.jitter, ic.pad);
    }
  }
  requestAnimationFrame(toolbarIconLoop);
}
toolbarIconLoop(0);
drawOutlineIcon();

// ─── Renderer ─────────────────────────────────────────────────────────────────
// One body, one place. The wrap-around world drew up to four copies of anything
// overhanging an edge; with walls a molecule can never straddle one.
// The four walls. At zoom 1 the box lines up with the toolbar, the energy bar
// and the screen edges, so this is barely visible and barely needed — but zoomed
// out there is empty canvas beyond it, and without a line the molecules look
// like they are bouncing off nothing. Kept faint on purpose; delete the call in
// drawWorld if it reads as clutter.
function drawWalls() {
  const LIGHT = document.body.classList.contains('screenshot-mode');
  ctx.save();
  ctx.strokeStyle = LIGHT ? 'rgba(0,0,0,0.22)' : 'rgba(150,190,255,0.16)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, world.w - 1, world.h - 1);
  ctx.restore();
}

function drawWorld() {
  ctx.fillStyle = document.body.classList.contains('screenshot-mode') ? getBgColor() : '#05040f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // World (0,0) sits at the top-left of the visible band; zoom is about its centre
  ctx.translate(0, world.top);
  ctx.translate(world.w / 2, world.h / 2);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-world.w / 2, -world.h / 2);

  drawWalls();
  if (document.getElementById('showFields').checked) drawFieldHeatmap(ctx);

  if (showAtoms) {
    for (const b of world.bodies) {
      drawElectrons(b);
      for (const p of bodyAtoms(b)) drawNucleus(ctx, p.x, p.y);
    }
  } else {
    drawSpaceFilling();   // all bodies at once: the layer is shared
  }

  ctx.restore();
  drawEnergyGraph();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let worldRAF   = null;
let lastFrame  = 0;
let lastDrawn  = 0;
let pctTick  = 0;

function timeScale() {
  return parseFloat(document.getElementById('playbackSpeed').value);
}

function worldLoop(now) {
  worldRAF = requestAnimationFrame(worldLoop);
  // Hold to the tier's frame rate. rAF may fire at 120 Hz or more; 60 is plenty
  // here, and the light tier settles for 30. Returning before `lastFrame` is
  // touched means the skipped time still counts towards the next step's dt.
  if (now - lastDrawn < frameBudgetMs - 1) return;
  lastDrawn = now;
  if (!lastFrame) lastFrame = now;
  // Clamp dt so a backgrounded tab does not resume with one enormous step that
  // tunnels molecules straight through each other.
  const rawDt = Math.min(0.05, (now - lastFrame) / 1000);
  const dt = rawDt * timeScale();
  lastFrame = now;
  stepTemperature(rawDt);
  if (running) {
    // Sub-step so fast molecules cannot pass through one another in one frame
    const steps = Math.max(1, Math.ceil(dt / 0.004));
    for (let k = 0; k < steps; k++) stepWorld(dt / steps);
    sampleEnergy();
    if (++pctTick % Math.round(TIER_FPS[_quality] / 4) === 0) updateEnergyPct();   // ~4 Hz either way
  }
  // Electrons run whether or not the sim does. Pause stops the molecules moving
  // and spinning; it does not stop an atom being an atom, and a frozen electron
  // reads as a broken picture rather than a paused one. It also means the trails
  // are already drawn on page load, before GO is ever pressed.
  // Once a frame, never per sub-step: the phase logic is tuned in per-frame units.
  stepElectrons(dt);
  drawWorld();
}

function startWorldLoop() {
  if (worldRAF === null) { lastFrame = 0; lastDrawn = 0; worldRAF = requestAnimationFrame(worldLoop); }
}

function setRunning(on) {
  running = on;
  const btn = document.getElementById('goBtn');
  btn.innerHTML = on ? '&#10073;&#10073; PAUSE' : '&#9654; GO';
  btn.classList.toggle('running', on);
  if (on) lastFrame = 0;
  logAction(on ? 'Started' : 'Paused');
}

// ─── Energy trace ─────────────────────────────────────────────────────────────
// A scrolling record of the world's total kinetic energy. With perfectly elastic
// collisions the line should stay flat — a visible step means energy leaked.
const GRAPH_WINDOW  = 12;     // seconds shown across the graph
const GRAPH_SAMPLES = 480;
let energyTrace = [];          // [{ t, motion }] — energy in fields joins this later
let energyAtSpawn   = 1;           // energy at spawn, the 100% line

function resetEnergyTrace() {
  energyTrace = [];
  energyAtSpawn = Math.max(1e-6, energyOfMotion());
}

function sampleEnergy() {
  energyTrace.push({ t: world.time, motion: energyOfMotion() });
  while (energyTrace.length > GRAPH_SAMPLES) energyTrace.shift();
  const cutoff = world.time - GRAPH_WINDOW;
  while (energyTrace.length && energyTrace[0].t < cutoff) energyTrace.shift();
}

function drawEnergyGraph() {
  const W = graphCanvas.width, H = graphCanvas.height;
  const PAD = 8, gH = H - PAD * 2;
  graphCtx.clearRect(0, 0, W, H);

  const LIGHT = document.body.classList.contains('screenshot-mode');
  const gridCol = LIGHT ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.06)';
  const axisCol = LIGHT ? 'rgba(0,0,0,0.55)' : 'rgba(0,200,255,0.35)';
  const motionCol   = LIGHT ? '#000'             : '#ff3a6e';
  const motionGlow  = LIGHT ? 'rgba(0,0,0,0)'    : 'rgba(255,45,100,0.9)';

  graphCtx.strokeStyle = gridCol;
  graphCtx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const y = PAD + gH * (1 - i / 4);
    graphCtx.beginPath(); graphCtx.moveTo(0, y); graphCtx.lineTo(W, y); graphCtx.stroke();
  }

  graphCtx.save();
  graphCtx.shadowBlur = LIGHT ? 0 : 6;
  graphCtx.shadowColor = LIGHT ? 'rgba(0,0,0,0)' : 'rgba(0,200,255,0.5)';
  graphCtx.strokeStyle = axisCol;
  graphCtx.lineWidth = 1;
  graphCtx.beginPath(); graphCtx.moveTo(0, H - PAD); graphCtx.lineTo(W, H - PAD); graphCtx.stroke();
  graphCtx.restore();

  if (energyTrace.length > 1) {
    const t1 = world.time, t0 = t1 - GRAPH_WINDOW;
    // Full scale is twice the starting energy, but grows to fit if the trace
    // runs higher — switching to High is a 9× jump and must stay on the graph.
    const peak = energyTrace.reduce((a, pt) => Math.max(a, pt.motion), 0);
    const full = Math.max(energyAtSpawn * 2, peak * 1.15);
    const px = (t) => ((t - t0) / GRAPH_WINDOW) * (W - 1);
    const py = (e) => PAD + gH * (1 - Math.max(0, Math.min(1, e / full)));
    const stroke = (lw, blur, alpha) => {
      graphCtx.save();
      graphCtx.globalAlpha = alpha;
      graphCtx.shadowBlur = LIGHT ? 0 : blur;
      graphCtx.shadowColor = motionGlow;
      graphCtx.strokeStyle = motionCol;
      graphCtx.lineWidth = lw;
      graphCtx.beginPath();
      energyTrace.forEach((pt, k) => {
        const x = px(pt.t), y = py(pt.motion);
        if (k === 0) graphCtx.moveTo(x, y); else graphCtx.lineTo(x, y);
      });
      graphCtx.stroke();
      graphCtx.restore();
    };
    stroke(8, 28, 0.25);
    stroke(3, 10, 0.55);
    stroke(1.5, 0, 1.0);
  }
}

function updateEnergyPct() {
  const el = document.getElementById('energyPctMotion');
  if (!el) return;
  el.textContent = Math.round(energyOfMotion() / energyAtSpawn * 100) + '%';
}

// With the band off the graph is a correctness check — a flat line means the
// collision solver conserves energy. With the band on it is not: holding the
// floor adds energy, so the line climbs and then plateaus. Say which it is.
function updateEnergyNote() {
  const el = document.getElementById('energyPctNote');
  if (!el) return;
  el.textContent = speedBandOn
    ? 'Speed band on \u2014 energy of motion drifts up, then levels off'
    : 'Total energy of motion, relative to the start';
}

let lastDialSpeed = 0;
document.getElementById('speedDial').addEventListener('input', function () {
  drawSpeedLines();
  // Scale the whole world by the same factor rather than flattening every
  // molecule to one speed — collisions have spread them out, and that spread
  // is the interesting part.
  const target = launchSpeed() * tempCurrent;
  if (lastDialSpeed > 0) {
    const k = target / lastDialSpeed;
    for (const b of world.bodies) { b.vx *= k; b.vy *= k; b.spin *= k; b.vTarget *= k; }
  }
  lastDialSpeed = target;
  resetEnergyTrace();
});

    '<div style="height:1px;background:rgba(255,255,255,0.12);margin:11px 0 2px;"></div>' +
    '<label style="display:flex;align-items:center;gap:7px;margin:9px 0 2px;cursor:pointer;">' +
      '<input type="checkbox" id="devEqui" checked style="margin:0">' +
      '<span>Heavy molecules start slower</span>' +
    '</label>' +
    '<div id="devEquiNote" style="opacity:0.45;font-size:10px;margin-left:21px;"></div>' +
    '<label style="display:flex;align-items:center;gap:7px;margin:9px 0 2px;cursor:pointer;">' +
      '<input type="checkbox" id="devBand" checked style="margin:0">' +
      '<span>Hold speeds in the band</span>' +
    '</label>' +
    '<div id="devBandNote" style="opacity:0.45;font-size:10px;margin-left:21px;"></div>' +
    '<div style="margin-top:10px;opacity:0.45;font-size:10px;">' +
      'Restitution ' + RESTITUTION.toFixed(2) + ' \u2014 collisions are elastic</div>';
  document.body.appendChild(panel);

  // Composition sliders respawn the world; the look sliders only change drawing.
  const bind = (id, apply, respawn, fmt = String) => {
    const sl  = panel.querySelector('#' + id);
    const val = panel.querySelector('#' + id + 'Val');
    sl.addEventListener('input', () => {
      const v = parseFloat(sl.value);
      apply(v);
      val.textContent = fmt(v);
      if (respawn) spawnWorld();
    });
  };
  bind('devH2',    v => composition.H2 = v, true);
  bind('devO2',    v => composition.O2 = v, true);
  bind('devHe',    v => composition.He = v, true);
  bind('devESpeed', v => eSpeed      = v, false, v => v.toFixed(2));
  bind('devETrail', v => eTrailScale = v, false, v => v.toFixed(2));
  bind('devESteer', v => eSteer      = v, false, v => v.toFixed(2));
  bind('devEWidth', v => eWidth      = v, false, v => v.toFixed(2));
  bind('devEWand',  v => eWander     = v, false, v => v.toFixed(2));
  bind('devERad',   v => eRadial     = v, false, v => v.toFixed(2));
  bind('devETilt',  v => eTilt       = v, false, v => v.toFixed(2));
  bind('devLoneR',  v => loneRadius  = v, false, v => v.toFixed(2) + '\u00d7');
  bind('devLoneS',  v => loneSpeed   = v, false, v => v.toFixed(3));
  bind('devNucleus', v => nucleusDiameter = v, false, v => v + ' px');
  bind('devSphereA', v => sphereOpacity = v, false, v => v.toFixed(2));
  bind('devSphereD', v => sphereDepth   = v, false, v => v.toFixed(2));
  bind('devSeamT',   v => seamTilt      = v, false, v => v.toFixed(2));
  // The field look was dialled in against the picture, so it stays adjustable
  bind('devLobeW',    v => FIELD_WIDTH = v, false, v => v.toFixed(2));
  bind('devLobeGain', v => FIELD_GAIN  = v, false, v => v.toFixed(1));
  bind('devFlare',    v => FLARE_GAIN  = v, false, v => v.toFixed(1));

  // Equipartition on/off, so both can be compared side by side
  const equi = panel.querySelector('#devEqui');
  const equiNote = panel.querySelector('#devEquiNote');
  const syncEquiNote = () => {
    equiNote.textContent = equipartition
      ? 'Equal kinetic energy \u2014 O\u2082 at \u00bc the speed of H\u2082'
      : 'Equal speed \u2014 O\u2082 at 16\u00d7 the energy of H\u2082';
  };
  equi.checked = equipartition;
  syncEquiNote();
  equi.addEventListener('change', () => {
    equipartition = equi.checked;
    syncEquiNote();
    spawnWorld();
    logAction('Equipartition ' + (equipartition ? 'on' : 'off'));
  });

  // Lone pairs on/off — H2 has none, so this only shows on O2 and water
  const lone = panel.querySelector('#devLone');
  const loneNote = panel.querySelector('#devLoneNote');
  const syncLoneNote = () => {
    loneNote.textContent = showLonePairs
      ? 'O\u2082: 4 bonding + 8 lone'
      : 'Bonding electrons only \u2014 4 per O\u2082';
  };
  lone.checked = showLonePairs;
  syncLoneNote();
  lone.addEventListener('change', () => {
    showLonePairs = lone.checked;
    syncLoneNote();
    logAction('Lone pairs ' + (showLonePairs ? 'on' : 'off'));
  });

  // Speed band on/off — off is the pure elastic result
  const clamp = panel.querySelector('#devBand');
  const clampNote = panel.querySelector('#devBandNote');
  const syncBandNote = () => {
    clampNote.textContent = speedBandOn
      ? '\u00b1' + Math.round(SPEED_SIGMA * 100) + '% of nominal; surplus goes to spin'
      : 'Pure elastic \u2014 speeds free to run away';
  };
  clamp.checked = speedBandOn;
  syncBandNote();
  clamp.addEventListener('change', () => {
    speedBandOn = clamp.checked;
    syncBandNote();
    updateEnergyNote();
    logAction('Speed band ' + (speedBandOn ? 'on' : 'off'));
  });

  let buf = '';
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    buf = (buf + e.key.toLowerCase()).slice(-3);
    if (buf === 'dev') {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      logAction('Toggled dev panel');
    }
  });
})();
