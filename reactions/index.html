// ─── Console diagnostics ──────────────────────────────────────────────────────
// Calibration lives on `window`, not in the UI: run it from the browser console
// on demand. Each one prints the measured values next to the constants they are
// compared against, so a discrepancy is obvious at a glance.
//   runPerfTest()      what a worst-case frame costs, vs the tier thresholds
//   speedHistogram()   the speed distribution per species, vs SPEED_SIGMA
//   energySplit()      motion vs rotation, and what the speed band cost
//   fieldTest()        the field heatmap's draw cost, per quality tier

// Console diagnostic: `runPerfTest()` re-measures and prints the numbers next to
// the constants they are compared against, without changing the current tier.
window.runPerfTest = function (samples = 5) {
  const runs = Array.from({ length: samples }, () => _runPerfBenchmark());
  const median = runs.slice().sort((a, b) => a - b)[Math.floor(samples / 2)];
  console.table([
    { metric: 'worst-case frame draw', value: +median.toFixed(2), unit: 'ms',
      note: '6 H2 + 6 O2 = 84 electrons x ' + TIER_BUCKETS['hi-res'] + ' buckets' },
    { metric: 'hi-res threshold',   value: TIER_THRESHOLD_MS['hi-res'],   unit: 'ms', note: 'below this -> hi-res' },
    { metric: 'detailed threshold', value: TIER_THRESHOLD_MS['detailed'], unit: 'ms', note: 'below this -> detailed' },
    { metric: 'frame budget @60fps', value: +(1000 / 60).toFixed(2), unit: 'ms', note: 'one whole frame' },
    { metric: 'would pick',   value: pickTier(median), unit: '', note: TIER_FPS[pickTier(median)] + ' fps' },
    { metric: 'current tier', value: _quality, unit: '', note: TIER_FPS[_quality] + ' fps' },
  ]);
  console.log('runs (ms):', runs.map(r => +r.toFixed(2)).join(', '));
  return { median: +median.toFixed(2), wouldPick: pickTier(median), current: _quality };
};

// Console diagnostic: how the world's energy is split between moving and
// spinning, and how often the band could not be enforced without a real
// energy change.
window.energySplit = function () {
  let trans = 0, rot = 0, outOfBand = 0;
  for (const b of world.bodies) {
    trans += 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy);
    rot   += 0.5 * b.inertia * b.spin * b.spin;
    const v = Math.hypot(b.vx, b.vy);
    if (v < b.vTarget * (1 - SPEED_SIGMA) - 0.5 ||
        v > b.vTarget * (1 + SPEED_SIGMA) + 0.5) outOfBand++;
  }
  const total = trans + rot;
  console.table([
    { part: 'translation', energy: +trans.toFixed(0), share: +(trans / total * 100).toFixed(1) + '%' },
    { part: 'rotation',    energy: +rot.toFixed(0),   share: +(rot   / total * 100).toFixed(1) + '%' },
    { part: 'total',       energy: +total.toFixed(0), share: '100%' },
  ]);
  console.log('band ' + (speedBandOn ? 'on' : 'off') +
    ' \u00b1' + Math.round(SPEED_SIGMA * 100) + '%  |  out of band now: ' + outOfBand + '/' + world.bodies.length +
    '  |  spin capped ' + spinCapHits + '\u00d7, floor topped up ' + floorTopUps + '\u00d7' +
    ' (+' + (energyCreated / Math.max(1, energyAtSpawn) * 100).toFixed(1) + '% of spawn energy created)' +
    '  |  vs energy at spawn: ' + (total / energyAtSpawn * 100).toFixed(1) + '%');
  return { trans: +trans.toFixed(0), rot: +rot.toFixed(0), outOfBand,
           overflow: spinCapHits, underflow: floorTopUps };
};

// How the speeds actually came out, per species. Run it after a spawn to see
// the intended bell; run it again after a minute to see what the collisions
// have made of it.
// What the bond-field heatmap costs to draw, at each tier, for the world as it
// stands right now. Printed against the frame budget it has to fit inside.
window.fieldTest = function (samples = 20) {
  const saved = _quality;
  const rows = [];
  for (const q of ['simple', 'detailed', 'hi-res']) {
    _quality = q;
    drawFieldHeatmap(ctx);                      // warm the buffers at this size
    const t0 = performance.now();
    for (let i = 0; i < samples; i++) drawFieldHeatmap(ctx);
    rows.push({ tier: q, grid: fieldW + 'x' + fieldH,
                ms: +((performance.now() - t0) / samples).toFixed(2),
                'of budget': ((performance.now() - t0) / samples / (1000 / TIER_FPS[q]) * 100).toFixed(1) + '%' });
  }
  _quality = saved;
  console.table(rows);
  console.log(world.bodies.length + ' molecules, ' + bondSegments().length +
    ' bond lobes (wrapped copies included)  |  frame budget ' +
    (1000 / TIER_FPS[saved]).toFixed(1) + ' ms at ' + saved);
  return rows;
};

window.speedHistogram = function (bins = 9) {
  const byType = new Map();
  for (const b of world.bodies) {
    const f = formulaOf(b.els);
    if (!byType.has(f)) byType.set(f, []);
    byType.get(f).push(Math.hypot(b.vx, b.vy));
  }
  const rows = [];
  for (const [f, v] of byType) {
    const n = v.length;
    const mean = v.reduce((a, x) => a + x, 0) / n;
    const sd = Math.sqrt(v.reduce((a, x) => a + (x - mean) ** 2, 0) / n);
    const lo = Math.min(...v), hi = Math.max(...v);
    rows.push({
      species: f, n,
      mean: +mean.toFixed(1), sd: +sd.toFixed(1),
      'sd/mean': +(sd / mean).toFixed(3),
      min: +lo.toFixed(1), max: +hi.toFixed(1),
      'spread in sd': +((hi - lo) / (sd || 1)).toFixed(2),
    });
  }
  console.table(rows);
  console.log('target sd/mean at spawn: ' + SPEED_SIGMA +
              '  (bounds are ±1σ, so a fresh spawn spans ~2σ)');
  // Crude bell check across everything
  const all = [...byType.values()].flat();
  if (all.length) {
    const lo = Math.min(...all), hi = Math.max(...all), w = (hi - lo) / bins || 1;
    const h = new Array(bins).fill(0);
    for (const x of all) h[Math.min(bins - 1, Math.floor((x - lo) / w))]++;
    h.forEach((c, i) => console.log(
      (lo + i * w).toFixed(0).padStart(5) + ' |' + '█'.repeat(c)));
  }
  return rows;
};

// ─── Init ─────────────────────────────────────────────────────────────────────
// Pick a quality tier from what this machine can actually draw. `runPerfTest()`
// in the console re-measures and shows the numbers; the dropdown overrides it.
(function _startupBenchmark() {
  const ms = _runPerfBenchmark();
  const tier = pickTier(ms);
  _applyQuality(tier);
  console.log(`[perf] worst-case frame ${ms.toFixed(2)} ms -> ${tier} @ ${TIER_FPS[tier]} fps` +
              ' (call runPerfTest() for the full table)');
})();
