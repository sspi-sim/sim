<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSPI Simulations — Chemistry Unit 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Lexend', system-ui, sans-serif;
  }

  /* The two panels are stacked and the whole stack is letterboxed, so neither
     image is ever cropped and the labels keep their proportion to the art.
     The ratio is the stack's: concrete is 1377x692 (1.990), glass is 1492x640
     (2.331), plus the gap between them —
       total height = W/1.990 + W/2.331 + 0.022W = 0.9535W  ->  1 / 0.9535 */
  #stack {
    position: fixed; inset: 0;
    margin: auto;
    aspect-ratio: 1.0488;
    max-width: 100%;
    max-height: 100%;
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    gap: 2.2%;
  }

  .panel {
    position: relative;
    display: block;
    width: 100%;
    text-decoration: none;
    line-height: 0;                 /* no stray inline-image gap */
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .panel img { width: 100%; height: auto; display: block; }

  /* Each label sits in the middle of its own image's empty band, found by
     scanning the artwork for rows that are flat and even enough to carry text:
       concrete — cream, y 46.7%-70.1% (23.6% tall), between the beam and the
                  base plate. The strip under the plate is only 4.3% tall, far
                  too thin for a label this size.
       glass    — dark, y 4.5%-61.4% (57% tall), above the particles and melt.
     Both labels are centred in their band, so each has clear space above and
     below rather than crowding an edge. */
  .label {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font-size: 8.4cqw;              /* 2x */
    font-weight: 600;
    letter-spacing: 0.22em;
    line-height: 1;
    pointer-events: none;
  }

  /* Band centre minus half the label's height. The label box is as tall as the
     font (line-height 1), and the font is a share of the STACK's width, so in
     panel-height terms it is 8.4% x the panel's own aspect ratio:
       concrete  8.4 x 1.990 = 16.7% tall  ->  58.4 - 8.35 = 50.0
       glass     8.4 x 2.331 = 19.6% tall  ->  33.0 - 9.79 = 23.2  */
  /* Centred on the WHITESPACE, not on the panel: at the label's rows the
     column and its shadow take the left 25.9%, so a panel-centred label starts
     at 19.2% and runs onto the column. Boxing it from 25.9% puts the ink at
     32.1%-93.7%, about 6 points clear on each side. */
  .concrete .label { color: #000; top: 50.0%; left: 25.9%; }
  .glass    .label { color: #fff; top: 23.2%; }

  .panel:hover, .panel:focus-visible {
    filter: brightness(1.06);
    transform: translateY(-2px);
    outline: none;
  }
</style>
</head>
<body>
<div id="stack">
  <a class="panel concrete" href="/concrete/">
    <img src="/chem3/images/concrete.jpg" alt="Concrete beam under load">
    <span class="label">CONCRETE</span>
  </a>
  <a class="panel glass" href="/glass/">
    <img src="/chem3/images/glass.jpg" alt="Glass melt">
    <span class="label">GLASS</span>
  </a>
</div>
</body>
</html>
